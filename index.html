<style>
:root{
  --bg:#1b1b1b; --p:#232323; --p2:#2c2c2c; --p3:#363636; --borda:#3b3b3b; --linha:#141414;
  --tx:#d8d8d8; --tx2:#8e8e8e; --azul:#4f9dff; --ouro:#C9A227;
  --cV:#3d6fa6; --cA:#3e7b45; --cT:#8b4fa3; --cI:#5d63b5; --pista:#262626; --pista2:#2a2a2a;
}
body.claro{
  --bg:#d9d9d9; --p:#f3f3f3; --p2:#e6e6e6; --p3:#d6d6d6; --borda:#c4c4c4; --linha:#bdbdbd;
  --tx:#1e1e1e; --tx2:#666; --azul:#1f6fd6; --ouro:#9b7a12; --pista:#ececec; --pista2:#e4e4e4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{background:var(--bg);color:var(--tx);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--borda);border-radius:4px;padding:4px 6px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--azul)}
#app{display:grid;grid-template-rows:34px var(--hSup,56vh) 5px 1fr 22px;height:100vh}
/* topo */
#topo{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--p);border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:center;gap:7px;margin-right:6px}
.marca img{width:22px;height:22px;border-radius:5px}
.marca b{font-family:Cinzel,serif;color:var(--ouro);letter-spacing:2px;font-size:14px}
.ver{font-size:10px;color:var(--tx2);border:1px solid var(--borda);border-radius:9px;padding:0 6px}
.mbt{background:none;border:none;padding:5px 8px;border-radius:4px;cursor:pointer;color:var(--tx)}
.mbt:hover{background:var(--p3)}
.abas{display:flex;gap:2px;margin-left:16px}
.abas button{background:none;border:none;padding:5px 10px;cursor:pointer;color:var(--tx2);font-size:13px}
.abas button.on{color:var(--tx);text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--azul)}
#tituloProj{flex:1;text-align:center;color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#salvoTx{color:var(--tx2);font-size:11px;margin-right:6px}
.ico{width:28px;height:26px;border:1px solid var(--borda);background:var(--p2);border-radius:5px;cursor:pointer;display:grid;place-items:center;font-size:13px}
.ico:hover{border-color:var(--azul)}
/* painéis */
#paineis{display:grid;grid-template-columns:var(--wEsq,300px) 5px minmax(240px,1fr) 5px var(--wDir,330px);gap:0;min-height:0;background:var(--linha)}
.painel{background:var(--p);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-bottom:1px solid var(--linha);color:var(--tx);flex:none}
.ph .t{font-weight:600}
.ph .sp{flex:1}
.pb{flex:1;overflow:auto;min-height:0}
/* bin */
.bt{background:var(--p2);border:1px solid var(--borda);border-radius:4px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--azul)}
.bt.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.bt:disabled{opacity:.4;cursor:default}
#bin{padding:4px}
.mi{display:flex;align-items:center;gap:8px;padding:4px;border-radius:4px;cursor:grab}
.mi:hover{background:var(--p2)}
.mi.sel{background:var(--p3)}
.mi .th{width:64px;height:36px;border-radius:3px;background:#000 center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:16px;color:#ccc}
.mi .nm{flex:1;min-width:0}
.mi .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .nm small{color:var(--tx2)}
.mi.off .nm b{color:#e0604f}
.mi.off .th{outline:2px solid #e0604f}
#bin.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
#bin.grade .mi{flex-direction:column;align-items:stretch;gap:3px}
#bin.grade .mi .th{width:100%;height:64px}
.vazioBin{color:var(--tx2);padding:18px;text-align:center;line-height:1.6}
/* monitor */
#monArea{flex:1;display:grid;place-items:center;min-height:0;background:var(--bg);overflow:hidden;position:relative}
#mon{background:#000;box-shadow:0 0 0 1px #000}
.monBarra{display:flex;align-items:center;gap:8px;padding:4px 10px;flex:none}
.tc{font-variant-numeric:tabular-nums;color:var(--azul);font-size:15px;cursor:text}
#monScrub{height:16px;margin:0 10px;position:relative;cursor:pointer;flex:none}
#monScrub .tr{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--p3)}
#monScrub .ph2{position:absolute;top:0;width:2px;height:16px;background:var(--azul)}
.transporte{display:flex;justify-content:center;gap:4px;padding:4px 0 8px;flex:none}
.transporte button{width:32px;height:28px;border:none;background:none;cursor:pointer;border-radius:4px;font-size:14px}
.transporte button:hover{background:var(--p3)}
.transporte .play{font-size:16px;color:var(--tx)}
/* propriedades */
#props{padding:6px 8px 20px}
.sec{border-bottom:1px solid var(--borda);padding:4px 0 8px}
.sec h4{margin:4px 0 4px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.sec h4 .rs{margin-left:auto;font-weight:400;color:var(--tx2);cursor:pointer;padding:0 4px}
.sec h4 .rs:hover{color:var(--azul)}
.sec.fechada .cont{display:none}
.lp{display:flex;align-items:center;gap:6px;padding:3px 0 3px 14px;min-height:24px}
.lp>label{width:118px;color:var(--tx2);flex:none}
.num{color:var(--azul);cursor:ew-resize;font-variant-numeric:tabular-nums;padding:1px 3px;border-radius:3px}
.num:hover{background:var(--p2)}
.lp input[type=range]{flex:1;accent-color:var(--azul)}
.lp input.ed{width:70px}
.nomeClip{font-weight:600;padding:4px 0 6px;display:flex;gap:6px;align-items:center}
.nomeClip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.dica{color:var(--tx2);line-height:1.6;padding:10px 4px}
.dica kbd,.kbd{background:var(--p3);border:1px solid var(--borda);border-radius:3px;padding:0 4px;font:11px ui-monospace,monospace;color:var(--tx)}
.botoes{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px 14px}
textarea.txt{width:100%;min-height:70px;resize:vertical}
/* abas do painel esquerdo e marcadores */
.abaP{background:none;border:none;color:var(--tx2);font-weight:600;padding:5px 4px;cursor:pointer;border-bottom:2px solid transparent}
.abaP.on{color:var(--tx);border-bottom-color:var(--azul)}
#marcs{padding:6px 8px}
.ioBox{background:var(--p2);border:1px solid var(--borda);border-radius:6px;padding:8px;line-height:1.9;margin-bottom:8px}
.ioBox b{color:var(--azul);font-variant-numeric:tabular-nums}
.mk{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:4px;cursor:pointer}
.mk:hover{background:var(--p2)}
.mk i{width:10px;height:10px;border-radius:2px;flex:none;transform:rotate(45deg)}
.mk .tcm{color:var(--azul);font-variant-numeric:tabular-nums;flex:none}
.mk .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .nm.vz{color:var(--tx2);font-style:italic}
.mk button{border:none;background:none;cursor:pointer;color:var(--tx2);padding:2px 4px;border-radius:3px}
.mk button:hover{background:var(--p3);color:var(--tx)}
#ioFaixa{position:absolute;top:0;background:rgba(120,170,255,.08);border-left:1px solid rgba(120,170,255,.5);border-right:1px solid rgba(120,170,255,.5);z-index:1;pointer-events:none;display:none}
/* transições e ducking na linha do tempo */
.trans{position:absolute;top:16px;bottom:5px;z-index:4;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.6));border:1px solid rgba(255,255,255,.75);border-radius:3px;
  font-size:10px;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;white-space:nowrap}
.trans.preto{background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(0,0,0,.85),rgba(255,255,255,.5));color:#fff}
.trans.sel{outline:2px solid var(--azul)}
.clip .duck{position:absolute;top:15px;bottom:0;background:rgba(0,0,0,.38);pointer-events:none;border-top:2px solid #e3b341}
#modelos{padding:6px 8px}
#props a,#modelos a,.dlg a{color:var(--azul)}
.gradeMod{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.modelo{background:var(--p2);border:1px solid var(--borda);border-radius:6px;padding:5px;cursor:pointer;text-align:center;font-size:11px}
.modelo:hover{border-color:var(--azul)}
.modelo canvas{display:block;margin:0 auto 4px;border-radius:3px;max-width:100%}
.clip .kfm{position:absolute;bottom:3px;width:7px;height:7px;margin-left:-4px;background:#fff;transform:rotate(45deg);border:1px solid #222;pointer-events:none;z-index:2}
.kfb{display:flex;gap:1px;margin-left:auto}
.kfb button{border:none;background:none;color:var(--tx2);cursor:pointer;padding:1px 3px;border-radius:3px;font-size:11px}
.kfb button:hover{background:var(--p3);color:var(--tx)}
.kfb button.on{color:var(--azul)}
.kfb button.tem{color:#e3b341}
#grav{position:fixed;right:76px;bottom:34px;width:390px;max-height:80vh;overflow:auto;z-index:850;background:var(--p);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#grav .gh{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:#e5534b}
#grav .lp{padding-left:0}
#grav video{width:100%;background:#000;border-radius:6px;margin:6px 0;max-height:200px}
.gvMed{flex:1;height:10px;background:var(--p3);border-radius:5px;overflow:hidden}.gvMed div{height:100%;width:0;background:#2fa84f}
.gvRec{display:flex;align-items:center;gap:14px;margin:10px 0}
.gvRec button{width:64px;height:64px;border-radius:50%;border:3px solid #e5534b;background:transparent;display:grid;place-items:center;cursor:pointer}
.gvRec button span{width:40px;height:40px;border-radius:50%;background:#e5534b;transition:all .2s}
.gvRec button.on span{width:24px;height:24px;border-radius:5px}
.gvRec button.on{animation:pulsar 1.4s infinite}
@keyframes pulsar{0%,100%{box-shadow:0 0 0 0 rgba(229,83,75,.5)}50%{box-shadow:0 0 0 12px rgba(229,83,75,0)}}
#contagem{position:absolute;inset:0;display:none;place-items:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none;z-index:5}
.cab .tb.rec{color:#e5534b;font-size:12px}
#avisoOff{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:#5a1f1f;border:1px solid #e5534b;color:#fff;border-radius:8px;padding:6px 8px 6px 12px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
/* divisores verticais dos painéis */
.divV{background:var(--linha);cursor:ew-resize;position:relative;z-index:2}
.divV:hover,.divV.ativo{background:var(--azul)}
.divV::after{content:'';position:absolute;inset:0 -4px}
#tl.redimCab,#tl.redimCab *{cursor:ew-resize!important}
body.arrastandoV,body.arrastandoV *{cursor:ew-resize!important;user-select:none}
/* divisor */
#divisor{background:var(--linha);cursor:ns-resize}
#divisor:hover{background:var(--azul)}
/* linha do tempo */
#pTl{display:grid;grid-template-columns:38px 1fr 58px;gap:2px;background:var(--linha);min-height:0}
#ferr{background:var(--p);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:34px}
#ferr button{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:5px;cursor:pointer;font-size:15px}
#ferr button.on{background:var(--azul);color:#fff}
#ferr button:hover{border-color:var(--borda)}
#tlWrap{background:var(--p);display:flex;flex-direction:column;min-width:0;min-height:0}
#tlTopo{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-bottom:1px solid var(--linha);flex:none}
#tlTopo .tc{font-size:16px;width:110px}
.tg{height:24px;min-width:26px;border:1px solid var(--borda);background:var(--p2);border-radius:4px;cursor:pointer;padding:0 6px}
.tg.on{background:var(--p3);border-color:var(--azul);color:var(--azul)}
#zoom{width:150px;accent-color:var(--azul)}
#tl{flex:1;overflow:auto;position:relative;min-height:0;background:var(--pista)}
.lin{display:flex;position:relative;width:max-content;min-width:100%}
.cab{position:sticky;left:0;z-index:6;width:var(--wCab,150px);flex:none;background:var(--p);border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:4px;padding:0 6px}
.cab .tn{width:26px;height:22px;border-radius:3px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:none}
.cab.v .tn{background:#3b5fa0}.cab.a .tn{background:#3b7a48}
.cab .tb{width:22px;height:20px;border:none;background:none;cursor:pointer;border-radius:3px;font-size:11px;color:var(--tx2);padding:0}
.cab .tb.on{color:#fff;background:#b8862d}
.cab .tb.mute.on{background:#b5562d}.cab .tb.solo.on{background:#c9a227;color:#111}
.cab .nmT{flex:1;color:var(--tx2);font-size:11px;white-space:nowrap;overflow:hidden}
.pista{position:relative;flex:none;border-bottom:1px solid var(--linha);background:var(--pista)}
.lin.av .pista{background:var(--pista2)}
.lin.regua{position:sticky;top:0;z-index:8;height:26px}
.lin.regua .cab{z-index:9;justify-content:center;color:var(--tx2)}
.lin.regua .pista{background:var(--p)}
#regua{position:sticky;left:var(--wCab,150px);display:block;height:26px}
.lin.trv{height:54px}.lin.tra{height:54px}
.sepVA{height:4px;background:var(--linha)}
.clip{position:absolute;top:2px;bottom:2px;border-radius:3px;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.5)}
.clip.grafico{background:#2a8a6c}.clip.video{background:var(--cV)}.clip.audio{background:var(--cA)}.clip.texto{background:var(--cT)}.clip.imagem{background:var(--cI)}
.clip.sel{outline:2px solid #fff;outline-offset:-2px;z-index:2}
body.claro .clip.sel{outline-color:#111}
.clip .fundo{position:absolute;left:0;right:0;top:15px;bottom:0;background-repeat:repeat-x;background-size:auto 100%;opacity:.85}
.clip canvas.onda{position:absolute;left:0;top:15px;width:100%;height:calc(100% - 15px)}
.clip .rot{position:absolute;left:4px;right:4px;top:1px;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px #000;pointer-events:none}
.clip .fx{position:absolute;top:0;bottom:0;pointer-events:none;background:rgba(0,0,0,.35)}
.clip .fx.e{left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.clip .fx.d{right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.clip .borda{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.clip .borda.e{left:0}.clip .borda.d{right:0}
.clip .borda:hover{background:rgba(255,255,255,.25)}
.clip.off{background:#7a2d2d}
#tl.navalha .clip,#tl.navalha .clip .borda{cursor:crosshair}
#tl.texto .pista{cursor:copy}
#ph{position:absolute;top:0;width:1px;background:var(--azul);z-index:4;pointer-events:none}
#snapLin{position:absolute;top:0;width:1px;background:#ffde4a;z-index:4;pointer-events:none;display:none}
#nav{height:18px;flex:none;position:relative;background:var(--p);border-top:1px solid var(--linha);margin-left:var(--wCab,150px);margin-right:6px}
#navPol{position:absolute;top:4px;height:10px;background:var(--p3);border:1px solid var(--borda);border-radius:6px;cursor:grab;min-width:24px}
#navPol:hover{border-color:var(--azul)}
#navPol .al{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--tx2);background:var(--p);cursor:ew-resize}
#navPol .al:hover{border-color:var(--azul)}
#navPol .al.e{left:-7px}#navPol .al.d{right:-7px}
#medidor{background:var(--p);display:flex;flex-direction:column;align-items:center;padding:6px 0}
#vu{flex:1;width:52px}
#status{background:var(--p);border-top:1px solid var(--linha);color:var(--tx2);padding:0 10px;display:flex;align-items:center;font-size:11px;gap:12px}
#status .sp{flex:1}
/* menus e diálogos */
.menu{position:fixed;z-index:1000;background:var(--p2);border:1px solid var(--borda);border-radius:6px;padding:4px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu div{padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;gap:12px}
.menu div:hover{background:var(--azul);color:#fff}
.menu div.dis{opacity:.4;pointer-events:none}
.menu div span.k{margin-left:auto;color:var(--tx2)}
.menu div:hover span.k{color:#fff}
.menu hr{border:none;border-top:1px solid var(--borda);margin:4px 0}
.fundoDlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:grid;place-items:center}
.dlg{background:var(--p);border:1px solid var(--borda);border-radius:10px;padding:18px 20px;width:min(520px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 12px;font-size:15px}
.dlg .lin2{display:flex;align-items:center;gap:10px;margin:8px 0}
.dlg .lin2>label{width:120px;color:var(--tx2)}
.dlg .lin2>input,.dlg .lin2>select{flex:1}
.dlg .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg p{color:var(--tx2);line-height:1.5}
.prog{height:8px;background:var(--p3);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.prog div{height:100%;width:0;background:var(--azul)}
.lstP{max-height:320px;overflow:auto}
.lstP .it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer}
.lstP .it:hover{background:var(--p2)}
.lstP .it .nm{flex:1}
.lstP .it small{color:var(--tx2)}
#toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--azul);padding:8px 14px;border-radius:6px;z-index:1100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
#toast.on{opacity:1}
#arrastoGhost{position:fixed;z-index:1000;pointer-events:none;background:var(--azul);color:#fff;padding:4px 8px;border-radius:4px;opacity:.85;display:none}
#ocultos{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none}
.atalhos td{padding:3px 10px 3px 0}
.atalhos td:first-child{white-space:nowrap}
</style>
</head>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const dbLin=db=>db<=-59.9?0:Math.pow(10,db/20);
const tick=()=>new Promise(r=>setTimeout(r,0));

let CAB=150;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms);}
function tc(t,fps){fps=fps||(P?P.seq.fps:30);const f=Math.round(Math.max(0,t)*fps),fr=f%fps,s=Math.floor(f/fps);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)+':'+pad(fr);}
function lerTC(str){const fps=P.seq.fps;const p=String(str).trim().split(/[:;.,]/).map(Number);if(p.some(isNaN))return null;
  while(p.length<4)p.unshift(0);const[h,m,s,f]=p.slice(-4);return h*3600+m*60+s+f/fps;}
const quadro=t=>Math.round(t*P.seq.fps)/P.seq.fps;
function tamTxt(b){return b>1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(0)+' MB';}

const DB={db:null,
  async abrir(){if(this.db)return this.db;this.db=await new Promise((ok,er)=>{const r=indexedDB.open('opsis',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projetos',{keyPath:'id'});d.createObjectStore('arquivos',{keyPath:'id'});d.createObjectStore('config',{keyPath:'k'});};
    r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error);});return this.db;},
  async op(st,modo,fn){const d=await this.abrir();return new Promise((ok,er)=>{const t=d.transaction(st,modo);const q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>er(t.error);});},
  get(st,k){return this.op(st,'readonly',s=>s.get(k));}, todos(st){return this.op(st,'readonly',s=>s.getAll());},
  put(st,v){return this.op(st,'readwrite',s=>s.put(v));}, del(st,k){return this.op(st,'readwrite',s=>s.delete(k));}
};

/* ---- transições (dissolver / mergulho para preto) e ducking ---- */
const adj=(a,b)=>Math.abs(fimDe(a)-b.start)<0.6/P.seq.fps;
function anteriorDe(c){for(const x of P.clips)if(x!==c&&x.trilha===c.trilha&&adj(x,c))return x;return null;}
function proximoDe(c){for(const x of P.clips)if(x!==c&&x.trilha===c.trilha&&adj(c,x))return x;return null;}
function trIn(c){return(c.trans&&c.trans.d>0&&anteriorDe(c))?c.trans.d/2:0;}
function trOut(c){const n=proximoDe(c);return(n&&n.trans&&n.trans.d>0)?n.trans.d/2:0;}
function visivelEm(c,t){return t>=c.start-trIn(c)-1e-6&&t<fimDe(c)+trOut(c)-1e-6;}
function tempoFonte(c,t){const m=midiaDe(c);let s=c.in+(t-c.start)*c.vel;if(s<0)s=0;if(m&&c.tipo!=='imagem'&&s>m.dur-0.02)s=Math.max(0,m.dur-0.02);return s;}
function fatorTrans(c,t){let f=1;const ti=trIn(c);
  if(ti>0&&t<c.start+ti){const u=(t-(c.start-ti))/(2*ti);f=c.trans.tipo==='preto'?(u<0.5?0:(u-0.5)*2):u;}
  const to=trOut(c);
  if(to>0&&t>fimDe(c)-to){const n=proximoDe(c),u=(t-(fimDe(c)-to))/(2*to);
    if(n.trans.tipo==='preto')f=Math.min(f,u<0.5?1-u*2:0);else if(c.tipo==='audio')f=Math.min(f,1-u);}
  return clamp(f,0,1);}
function fatorDuck(tr,t){const d=P.duck;if(!d||!d.musica.includes(tr)||!d.segs.length)return 1;const g=dbLin(d.db),A=0.25,R=0.6,s=d.segs;
  let lo=0,hi=s.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(s[m][0]<=t+A)lo=m;else hi=m-1;}
  let f=1;for(const i of[lo-1,lo]){const sg=s[i];if(!sg)continue;let x;if(t>=sg[0]&&t<=sg[1])x=1;else if(t<sg[0])x=1-(sg[0]-t)/A;else x=1-(t-sg[1])/R;
    if(x>0)f=Math.min(f,1-(1-g)*Math.min(1,x));}
  return f;}

function sobrescrever(tr,a,b,ignorar){
  for(const c of [...P.clips]){
    if(c.trilha!==tr||ignorar.has(c.id))continue;const ca=c.start,cb=fimDe(c);
    if(cb<=a+1e-6||ca>=b-1e-6)continue;
    if(ca>=a-1e-6&&cb<=b+1e-6){P.clips.splice(P.clips.indexOf(c),1);sel.delete(c.id);}
    else if(ca<a&&cb>b){const r=clonar(c);r.id=uid();r.grupo=null;r.start=b;r.in=c.in+(b-ca)*c.vel;r.dur=cb-b;r.p.fadeIn=0;delete r.trans;deslocarKF(r,b-ca);c.dur=a-ca;c.p.fadeOut=0;P.clips.push(r);}
    else if(ca<a){c.dur=a-ca;c.p.fadeOut=Math.min(c.p.fadeOut,c.dur);}
    else{const corte=b-ca;c.in+=corte*c.vel;c.start=b;c.dur=cb-b;deslocarKF(c,corte);c.p.fadeIn=Math.min(c.p.fadeIn,c.dur);}
  }
}
function dividirEm(clips,t){const novos=new Map();let n=0;
  for(const c of clips){if(travada(c.trilha))continue;if(t<=c.start+0.5/P.seq.fps||t>=fimDe(c)-0.5/P.seq.fps)continue;
    const r=clonar(c);r.id=uid();if(c.grupo){if(!novos.has(c.grupo))novos.set(c.grupo,uid());r.grupo=novos.get(c.grupo);}
    r.start=t;r.in=c.in+(t-c.start)*c.vel;r.dur=fimDe(c)-t;r.p.fadeIn=0;delete r.trans;deslocarKF(r,t-c.start);c.dur=t-c.start;c.p.fadeOut=0;P.clips.push(r);n++;}
  return n;}
function dividirNoIndicador(){const t=quadro(T);let alvo=[...sel].map(id=>P.clips.find(c=>c.id===id)).filter(c=>c&&ativoEm(c,t));
  if(!alvo.length)alvo=P.clips.filter(c=>ativoEm(c,t));
  if(!alvo.length)return toast('Não há clipe sob o indicador de reprodução.');
  marcar();const n=dividirEm(alvo,t);if(!n){desfazerPilha.pop();return;}posMudanca();}
function excluirSelecao(ondulada){if(!sel.size)return;
  mudar(()=>{const rem=P.clips.filter(c=>sel.has(c.id)&&!travada(c.trilha));
    for(const c of rem)P.clips.splice(P.clips.indexOf(c),1);
    if(ondulada){for(const c of rem.sort((a,b)=>b.start-a.start)){for(const o of P.clips)if(o.trilha===c.trilha&&o.start>=fimDe(c)-1e-6)o.start=Math.max(0,o.start-c.dur);}}
    sel.clear();});}
function inserirMidia(m,trilha,t,aLivre){t=Math.max(0,quadro(t));const idx=Math.max(0,listaDe(trilha).indexOf(trilha));
  const vT=P.vT[Math.min(idx,P.vT.length-1)];let aT=P.aT[Math.min(idx,P.aT.length-1)];
  if(aLivre&&m.tipo==='video'&&m.temAudio){const ocupa=tr=>P.clips.some(c=>c.trilha===tr&&c.start<t+m.dur-1e-6&&fimDe(c)>t+1e-6);
    if(ocupa(aT)){aT=P.aT.find(tr=>!travada(tr)&&!ocupa(tr));if(!aT){aT='A'+(P.aT.length+1);P.aT.push(aT);P.trilhas[aT]={mudo:false,solo:false,trava:false};}}}const res=[];
  if(m.tipo==='video'){const g=m.temAudio?uid():null;res.push(novoClip('video',vT,t,m.dur,{midia:m.id,grupo:g}));
    if(m.temAudio)res.push(novoClip('audio',aT,t,m.dur,{midia:m.id,grupo:g}));}
  else if(m.tipo==='audio')res.push(novoClip('audio',ehV(trilha)?aT:trilha,t,m.dur,{midia:m.id}));
  else res.push(novoClip('imagem',ehV(trilha)?trilha:vT,t,5,{midia:m.id}));
  for(const r of res){if(travada(r.trilha)){toast('A trilha '+r.trilha+' está travada.');return[];}}
  for(const r of res){sobrescrever(r.trilha,r.start,fimDe(r),new Set());P.clips.push(r);}
  return res;}
function novoTexto(trilha,t){if(!trilha){trilha=[...P.vT].reverse().find(tr=>!travada(tr)&&!P.clips.some(c=>c.trilha===tr&&ativoEm(c,T)))||P.vT[P.vT.length-1];}
  t=Math.max(0,quadro(t??T));marcar();const c=novoClip('texto',trilha,t,5);sobrescrever(trilha,t,t+5,new Set());P.clips.push(c);
  sel=new Set([c.id]);foco=c.id;posMudanca();setTimeout(()=>{const a=$('#props textarea');if(a){a.focus();a.select();}},50);}
function copiar(recortar){if(!sel.size)return;const cl=P.clips.filter(c=>sel.has(c.id));const t0=Math.min(...cl.map(c=>c.start));
  areaTransf=cl.map(c=>Object.assign(clonar(c),{start:c.start-t0}));toast(recortar?'Recortado.':cl.length+' clipe(s) copiado(s).');if(recortar)excluirSelecao(false);}
function colar(){if(!areaTransf)return;mudar(()=>{const mapa=new Map();const novos=areaTransf.map(c=>{const n=clonar(c);n.id=uid();
    if(n.grupo){if(!mapa.has(n.grupo))mapa.set(n.grupo,uid());n.grupo=mapa.get(n.grupo);}n.start=quadro(T)+c.start;return n;});
  for(const n of novos){if(!P.trilhas[n.trilha])continue;sobrescrever(n.trilha,n.start,fimDe(n),new Set());P.clips.push(n);}
  sel=new Set(novos.map(n=>n.id));T=Math.max(...novos.map(fimDe));});}
function alternarVinculo(){const cl=P.clips.filter(c=>sel.has(c.id));if(!cl.length)return;
  if(cl.some(c=>c.grupo)){mudar(()=>cl.forEach(c=>c.grupo=null));toast('Clipes desvinculados — agora se movem separadamente.');}
  else if(cl.length>1){const g=uid();mudar(()=>cl.forEach(c=>c.grupo=g));toast('Clipes vinculados.');}}
function pontosEdicao(){const s=new Set([0]);for(const c of P.clips){s.add(+c.start.toFixed(5));s.add(+fimDe(c).toFixed(5));}return[...s].sort((a,b)=>a-b);}

/* ===================== mídia: importar ===================== */
const EXT_V=/\.(mp4|mov|m4v|webm|mkv|avi)$/i, EXT_A=/\.(mp3|wav|m4a|aac|ogg|oga|flac|opus|aif|aiff)$/i, EXT_I=/\.(png|jpe?g|webp|gif|bmp|heic|avif)$/i;
function tipoArquivo(f){if(/^image\//.test(f.type)||EXT_I.test(f.name))return'imagem';if(/^audio\//.test(f.type)||EXT_A.test(f.name))return'audio';if(/^video\//.test(f.type)||EXT_V.test(f.name))return'video';return null;}
function registrarArquivo(m,f){arquivos.set(m.id,f);if(urls.has(m.id))URL.revokeObjectURL(urls.get(m.id));const u=URL.createObjectURL(f);urls.set(m.id,u);
  if(m.tipo==='imagem'){const im=new Image();im.onload=()=>{imagens.set(m.id,im);sujo=true;};im.src=u;}sujo=true;}
async function escolherArquivos(){
  if(window.showOpenFilePicker){try{const hs=await showOpenFilePicker({multiple:true,types:[{description:'Vídeo, áudio e imagem',accept:{'video/*':['.mp4','.mov','.m4v','.webm','.mkv'],'audio/*':['.mp3','.wav','.m4a','.aac','.ogg','.flac'],'image/*':['.png','.jpg','.jpeg','.webp','.gif']}}]});
      const ent=[];for(const h of hs)ent.push({file:await h.getFile(),handle:h});return ent;}catch(e){if(e.name==='AbortError')return[];}}
  return new Promise(ok=>{const i=$('#arqIn');i.onchange=()=>{const fs=[...i.files];i.value='';ok(fs.map(f=>({file:f})));};i.click();});}
async function importar(entradas,depois){const novos=[];
  for(const{file,handle}of entradas){const tipo=tipoArquivo(file);if(!tipo){toast('“'+file.name+'” não é vídeo, áudio ou imagem.');continue;}
    $('#stTx').textContent='Importando '+file.name+'…';
    try{const m=await analisar(file,tipo);m.id=uid();P.midias.push(m);registrarArquivo(m,file);
      if(handle){handles.set(m.id,handle);try{await DB.put('arquivos',{id:m.id,handle});}catch(e){}}
      novos.push(m);renderBin();}
    catch(e){console.error(e);toast('Não consegui abrir “'+file.name+'”: '+(e.message||e),5000);}}
  $('#stTx').textContent=dicaFerramenta();salvarDepois();
  if(novos.length){toast(novos.length+' arquivo(s) importado(s). Arraste para a linha do tempo.');if(depois)depois(novos);filaPicos(novos);}
  return novos;}
async function miniatura(fonte,w,h){const W=160,H=90,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,W,H);
  const s=Math.min(W/w,H/h);g.drawImage(fonte,(W-w*s)/2,(H-h*s)/2,w*s,h*s);return c.toDataURL('image/jpeg',0.7);}
async function analisar(file,tipo){
  const m={nome:file.name,tipo,tamanho:file.size,dur:5,w:0,h:0,fps:0,temAudio:false,thumb:null,picos:null,ult:file.lastModified};
  if(tipo==='imagem'){const u=URL.createObjectURL(file);const im=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('formato de imagem não suportado'));i.src=u;});
    m.w=im.naturalWidth;m.h=im.naturalHeight;m.thumb=await miniatura(im,m.w,m.h);URL.revokeObjectURL(u);return m;}
  try{const B=await mb();const inp=new B.Input({source:new B.BlobSource(file),formats:B.ALL_FORMATS});
    m.dur=await inp.computeDuration();const vt=tipo==='audio'?null:await inp.getPrimaryVideoTrack();const at=await inp.getPrimaryAudioTrack();
    m.temAudio=!!at;
    if(vt){m.tipo='video';m.w=vt.displayWidth;m.h=vt.displayHeight;try{const st=await vt.computePacketStats(90);m.fps=Math.round(st.averagePacketRate*100)/100;}catch(e){}
      try{if(await vt.canDecode()){const sk=new B.CanvasSink(vt,{width:160,height:Math.max(2,Math.round(160*m.h/m.w)),fit:'contain'});const w=await sk.getCanvas(Math.min(1,m.dur/3));if(w)m.thumb=await miniatura(w.canvas,w.canvas.width,w.canvas.height);}else m.semDecod=true;}catch(e){}}
    else m.tipo='audio';
    if(m.tipo==='audio'&&!at)throw new Error('o arquivo não tem áudio');}
  catch(e){ // plano B: o próprio navegador
    const u=URL.createObjectURL(file);const v=document.createElement(tipo==='audio'?'audio':'video');v.preload='metadata';v.muted=true;v.src=u;
    await new Promise((ok,er)=>{v.onloadedmetadata=ok;v.onerror=()=>er(new Error('formato não suportado por este navegador'));});
    m.dur=v.duration;if(tipo!=='audio'&&v.videoWidth){m.tipo='video';m.w=v.videoWidth;m.h=v.videoHeight;m.temAudio=true;
      await new Promise(ok=>{v.onseeked=ok;v.currentTime=Math.min(1,m.dur/3);setTimeout(ok,1500);});try{m.thumb=await miniatura(v,m.w,m.h);}catch(e){}}
    else{m.tipo='audio';m.temAudio=true;}URL.revokeObjectURL(u);}
  return m;}
/* forma de onda (picos), calculada aos poucos em segundo plano */
const PR=20;let picosOcupado=false;const filaP=[];
function filaPicos(ms){for(const m of ms)if(m.temAudio&&!m.picos&&arquivos.has(m.id))filaP.push(m);if(!picosOcupado)proxPicos();}
async function proxPicos(){const m=filaP.shift();if(!m){picosOcupado=false;return;}picosOcupado=true;
  try{const B=await mb();const inp=new B.Input({source:new B.BlobSource(arquivos.get(m.id)),formats:B.ALL_FORMATS});const at=await inp.getPrimaryAudioTrack();
    const n=Math.ceil(m.dur*PR)+1,arr=new Uint8Array(n);const sk=new B.AudioBufferSink(at);let k=0;
    for await(const w of sk.buffers()){const b=w.buffer,sr=b.sampleRate,d=b.getChannelData(0);
      for(let i=0;i<b.length;i+=3){const v=Math.abs(d[i]);const ix=Math.floor((w.timestamp+i/sr)*PR);if(ix>=0&&ix<n){const q=Math.min(255,v*255|0);if(q>arr[ix])arr[ix]=q;}}
      if(++k%40===0)await tick();}
    let s='';for(let i=0;i<arr.length;i+=8192)s+=String.fromCharCode.apply(null,arr.subarray(i,i+8192));m.picos=btoa(s);}
  catch(e){console.warn('picos',e);}
  if(m.picos)m._p=null;renderTimeline();salvarDepois();setTimeout(proxPicos,50);}
function picosDe(m){if(!m.picos)return null;if(!m._p){const s=atob(m.picos);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);Object.defineProperty(m,'_p',{value:a,writable:true,enumerable:false});}return m._p;}

/* ---- reconectar filmagens: por PASTA (1 permissão vale para todos os arquivos dela) ---- */
const faltando=()=>P.midias.filter(m=>!arquivos.has(m.id));
async function pastasLembradas(){const l=[];try{const g=await DB.get('config','pastaGrav');if(g&&g.v)l.push({h:g.v,modo:'readwrite',grav:true});}catch(e){}
  try{const r=await DB.get('config','pastasMidia');for(const x of(r&&r.v)||[])if(!(await Promise.all(l.map(y=>y.h.isSameEntry(x).catch(()=>false)))).some(Boolean))l.push({h:x,modo:'read'});}catch(e){}return l;}
async function lembrarPasta(d){try{const r=await DB.get('config','pastasMidia');const v=(r&&r.v)||[];
  for(const x of v)if(await x.isSameEntry(d).catch(()=>false))return;v.unshift(d);await DB.put('config',{k:'pastasMidia',v:v.slice(0,12)});}catch(e){}}
// procura, dentro da pasta (e subpastas), os arquivos que faltam, pelo nome (e tamanho, quando conhecido)
async function procurarNaPasta(dir,info){let achou=0,lidos=0;const alvo=new Map();
  for(const m of faltando()){const k=nfc(m.nome);if(!alvo.has(k))alvo.set(k,[]);alvo.get(k).push(m);}
  async function varrer(d,nivel){if(!alvo.size)return;
    for await(const[nome,e]of d.entries()){if(!alvo.size)return;lidos++;if(info&&lidos%200===0)info('Procurando… '+lidos+' itens vistos');
      if(e.kind==='directory'){if(nivel<5&&!nome.startsWith('.')&&!/\.(app|photoslibrary|fcpbundle|prproj)$/i.test(nome)&&!/^Adobe Premiere Pro (Audio Previews|Auto-Save)$/.test(nome))await varrer(e,nivel+1).catch(()=>{});continue;}
      const l=alvo.get(nfc(nome));if(!l)continue;
      try{const f=await comPrazo(e.getFile(),15000);let i=l.findIndex(m=>m.tamanho&&m.tamanho===f.size);if(i<0)i=0;const m=l.splice(i,1)[0];if(!l.length)alvo.delete(nfc(nome));
        registrarArquivo(m,f);handles.set(m.id,e);DB.put('arquivos',{id:m.id,handle:e}).catch(()=>{});if(m.pendenteAnalise)reanalisar(m,f);achou++;}catch(x){console.warn('ler',nome,x);}}}
  await varrer(dir,0);return achou;}
function depoisDeReconectar(n){if(n){renderBin();renderTimeline();limparElems();sujo=true;filaPicos(P.midias);}}
function reconectar(){dlgReconectar(0).catch(e=>{console.error(e);toast('Erro ao reconectar: '+e.message,8000);});}
async function dlgReconectar(jaFeitas){
  const d=dialogo(`<h3>Reconectar as filmagens</h3>
    <p>O Chrome, por segurança, esquece a permissão de ler os arquivos quando é fechado. Basta liberar <b>a pasta</b> onde eles estão: uma permissão vale para todos os arquivos dela (e das subpastas).</p>
    <div id="rcPastas" style="display:flex;flex-direction:column;gap:6px;margin:8px 0"></div>
    <p style="margin:10px 0 4px"><b>Ainda faltam <span id="rcN"></span>:</b></p>
    <ul id="rcLista" style="padding-left:18px;line-height:1.55;max-height:170px;overflow:auto;margin:0"></ul>
    <p id="rcSt" style="color:var(--tx2);min-height:1.3em;margin-top:8px">Verificando…</p>
    <div class="acoes"><button class="bt" id="rcArq">Escolher arquivos…</button><button class="bt" onclick="fecharDialogo()">Fechar</button><button class="bt pri" id="rcPasta">Escolher a pasta…</button></div>`);
  const st=t=>{d.querySelector('#rcSt').textContent=t;};let total=jaFeitas||0;
  const atualizar=()=>{const f=faltando();d.querySelector('#rcN').textContent=f.length+' arquivo(s)';
    d.querySelector('#rcLista').innerHTML=f.map(m=>'<li>'+esc(m.nome)+(m.caminho?' <span style="color:var(--tx2);font-size:12px">— '+esc(m.caminho.replace(/\/[^/]*$/,''))+'</span>':'')+'</li>').join('');
    if(!f.length){fecharDialogo();toast('Pronto! '+total+' filmagem(ns) reconectada(s).');}};
  const usar=async(dir,modo)=>{st('Procurando em “'+dir.name+'”…');const n=await procurarNaPasta(dir,st);total+=n;depoisDeReconectar(n);
    st(n?'Achei '+n+' arquivo(s) em “'+dir.name+'”.':'Nenhum dos arquivos que faltam está em “'+dir.name+'” (nem nas subpastas).');atualizar();};
  const box=d.querySelector('#rcPastas');atualizar();
  d.querySelector('#rcPasta').onclick=async()=>{if(!window.showDirectoryPicker){st('Este navegador não escolhe pastas; use “Escolher arquivos…”.');return;}
    try{st('Abrindo o seletor de pastas…');const dir=await showDirectoryPicker({id:'opsis-filmagens',mode:'read'});await lembrarPasta(dir);await usar(dir,'read');}
    catch(e){if(e.name!=='AbortError')st(e.name==='SecurityError'||/system|blocked/i.test(e.message)?'O Chrome não deixa escolher essa pasta (é uma pasta do sistema ou a raiz do disco). Entre numa pasta mais específica, como “Simone” ou “2025”.':'Erro: '+e.message);}};
  d.querySelector('#rcArq').onclick=async()=>{const faltam=faltando();const ent=await escolherArquivos();let n=0;
    for(const{file,handle}of ent){const fn=nfc(file.name);const m=faltam.find(x=>!arquivos.has(x.id)&&nfc(x.nome)===fn&&(!x.tamanho||x.tamanho===file.size))||faltam.find(x=>!arquivos.has(x.id)&&nfc(x.nome)===fn);
      if(m){registrarArquivo(m,file);n++;if(m.pendenteAnalise)reanalisar(m,file);if(handle){handles.set(m.id,handle);DB.put('arquivos',{id:m.id,handle}).catch(()=>{});}}}
    total+=n;depoisDeReconectar(n);st(n?n+' arquivo(s) reconectado(s).':(ent.length?'Esses arquivos não têm o mesmo nome dos que faltam.':''));atualizar();};
  let lemb=[];try{lemb=await comPrazo(pastasLembradas(),5000);}catch(e){console.warn('pastas',e);}
  // pastas que o Chrome ainda deixa ler: procura sem perguntar
  for(const p of lemb){try{if((await comPrazo(p.h.queryPermission({mode:p.modo}),4000))==='granted'){p.ok=true;await usar(p.h,p.modo);}}catch(e){console.warn('verificar',p.h.name,e);}}
  if(!d.isConnected)return;if(d.querySelector('#rcSt').textContent==='Verificando…')st('');
  for(const p of lemb){if(p.ok)continue;const b=document.createElement('button');b.className='bt';b.style.textAlign='left';
    b.innerHTML='📁 Liberar “'+esc(p.h.name)+'”'+(p.grav?' <span style="color:var(--tx2)">(pasta das gravações)</span>':'');
    b.onclick=async()=>{st('Pedindo permissão ao Chrome para “'+p.h.name+'”…');try{if((await p.h.requestPermission({mode:p.modo}))!=='granted'){st('O Chrome não liberou “'+p.h.name+'”. Use “Escolher a pasta…”.');return;}
      b.disabled=true;b.textContent='✓ '+p.h.name;await usar(p.h,p.modo);}catch(e){st('Erro: '+e.message);}};box.appendChild(b);}
  if(!box.children.length)box.innerHTML='<p style="color:var(--tx2);margin:0">Toque em “Escolher a pasta…” e escolha a pasta das filmagens (por exemplo, a pasta “2025” no disco Mac - 2TB). O app procura sozinho, inclusive nas subpastas, e lembra dessa pasta nas próximas vezes.</p>';}

/* ===================== entrada/saída e marcadores ===================== */
function mudarMarca(fn){marcar();fn();salvarDepois();desenharRegua();renderMarcadores();}
function definirEntrada(t){mudarMarca(()=>{P.entrada=quadro(clamp(t,0,durSeq()));if(P.saida!=null&&P.saida<=P.entrada)P.saida=null;});toast('Entrada em '+tc(P.entrada));}
function definirSaida(t){mudarMarca(()=>{P.saida=quadro(clamp(t,0,durSeq()));if(P.entrada!=null&&P.entrada>=P.saida)P.entrada=null;});toast('Saída em '+tc(P.saida));}
function limparIO(){mudarMarca(()=>{P.entrada=null;P.saida=null;});toast('Entrada e saída limpas.');}
function faixaIO(){const d=durSeq();if(P.entrada==null&&P.saida==null)return null;const a=P.entrada??0,b=Math.min(P.saida??d,d);return b>a+1/P.seq.fps?{a,b}:null;}
function marcadorPerto(t,px=6){return P.marcadores.find(m=>Math.abs(m.t-t)*pps<=px);}
function addMarcador(t){t=quadro(t);const ex=P.marcadores.find(m=>Math.abs(m.t-t)<0.5/P.seq.fps);if(ex){renomearMarcador(ex);return;}
  mudarMarca(()=>P.marcadores.push({id:uid(),t,nome:'',cor:'#3fb950'}));toast('Marcador em '+tc(t)+'. Dê um nome na aba Marcadores.');}
function renomearMarcador(m){const n=prompt('Nome do marcador:',m.nome);if(n==null)return;mudarMarca(()=>{const x=P.marcadores.find(k=>k.id===m.id);if(x)x.nome=n.trim();});}
function excluirMarcador(m){mudarMarca(()=>P.marcadores=P.marcadores.filter(x=>x.id!==m.id));}
function proxMarcador(dir){const ms=[...P.marcadores].sort((a,b)=>a.t-b.t);const m=dir>0?ms.find(x=>x.t>T+1e-4):[...ms].reverse().find(x=>x.t<T-1e-4);if(m)irPara(m.t);else toast('Não há '+(dir>0?'próximo':'anterior')+' marcador.');}
function trechoEntreMarcadores(m){const ms=[...P.marcadores].sort((a,b)=>a.t-b.t);const i=ms.findIndex(x=>x.id===m.id);const fim=i<ms.length-1?ms[i+1].t:durSeq();
  mudarMarca(()=>{P.entrada=m.t;P.saida=fim;});toast('Trecho marcado: '+tc(m.t)+' a '+tc(fim));}
const CORES_M=['#3fb950','#e5534b','#e3b341','#4f9dff','#c06be0','#ffffff'];
function renderMarcadores(){const box=$('#marcs');if(!box||!P)return;const io=faixaIO();
  let h=`<div class="ioBox">Entrada <b>${P.entrada!=null?tc(P.entrada):'—'}</b> · Saída <b>${P.saida!=null?tc(P.saida):'—'}</b>${io?' · <span style="color:var(--tx2)">'+tc(io.b-io.a)+'</span>':''}<br>
    <button class="bt" data-a="ent">{ Entrada (I)</button> <button class="bt" data-a="sai">} Saída (O)</button> <button class="bt" data-a="lim" ${P.entrada==null&&P.saida==null?'disabled':''}>Limpar</button><br>
    <button class="bt pri" data-a="exp" ${io?'':'disabled'}>Exportar trecho</button> <button class="bt" data-a="leg" ${io?'':'disabled'}>💬 Legendar trecho</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin:4px 0 6px"><b style="flex:1">Marcadores</b><button class="bt" data-a="add">◆ Marcar (M)</button></div>`;
  const ms=[...P.marcadores].sort((a,b)=>a.t-b.t);
  if(!ms.length)h+='<div class="dica">Enquanto assiste, aperte <kbd>M</kbd> nos pontos importantes (início de um assunto, uma frase marcante). Depois, um clique leva até ele, e o botão ⇥ marca o trecho até o próximo marcador para exportar ou legendar.</div>';
  for(const m of ms)h+=`<div class="mk" data-id="${m.id}"><i style="background:${m.cor||'#3fb950'}" data-a="cor" title="Mudar cor"></i><span class="tcm">${tc(m.t)}</span><span class="nm ${m.nome?'':'vz'}">${esc(m.nome||'sem nome')}</span>
    <button data-a="trecho" title="Marcar o trecho daqui até o próximo marcador">⇥</button><button data-a="ren" title="Renomear">✎</button><button data-a="del" title="Excluir">✕</button></div>`;
  box.innerHTML=h;}

/* ===================== linha do tempo ===================== */
const tl=$('#tl');
function larguraTl(){return Math.max(durSeq()+30,(tl.clientWidth-CAB)/pps)*pps;}
function tempoEm(clientX){const r=tl.getBoundingClientRect();return Math.max(0,(clientX-r.left-CAB+tl.scrollLeft)/pps);}
let rafTl=0;function renderTimelineDepois(){if(!rafTl)rafTl=requestAnimationFrame(()=>{rafTl=0;renderTimeline();});}

  mudar(()=>{P.clips=P.clips.filter(c=>c.trilha!==tr);sel=new Set([...sel].filter(id=>P.clips.some(c=>c.id===id)));
    L.splice(L.indexOf(tr),1);delete P.trilhas[tr];

  const antigos=[...L],mapa={},novasTr={};antigos.forEach((t,i)=>mapa[t]=tipo+(i+1));

const filhos=(el,tag)=>el?[...el.children].filter(x=>x.tagName===tag):[];

    const pend=[];// transições a aplicar depois
    itens.forEach((it,i)=>{
      if(it.tagName==='transitionitem'){const s=+txtDe(it,'start'),e=+txtDe(it,'end'),al=txtDe(it,'alignment'),ef=filho(it,'effect'),nm=txtDe(ef,'name')||txtDe(ef,'effectid');
        pend.push({i,s,e,al,tipo:/dip|black|preto|cor/i.test(nm)?'preto':'dissolver',nome:nm});return;}
      const ehGerador=it.tagName==='generatoritem';
      if(txtDe(it,'enabled').toUpperCase()==='FALSE'){aviso('Clipes desativados no Premiere não foram trazidos.');return;}
      if(filho(it,'sequence')){aviso('Sequências aninhadas (nest) não são suportadas: ficaram de fora. Exporte o XML da sequência interna também.');return;}
      const cr=taxaDe(it,R);let s=+txtDe(it,'start'),e=+txtDe(it,'end'),ini=+txtDe(it,'in')||0,fim=+txtDe(it,'out')||0;

async function pararGravacao(){const g=GR;if(!g||!g.rec||!gravandoAgora)return;const $g=s=>g.el.querySelector(s);gravandoAgora=false;clearInterval(g.relogio);

async function dlgAbrir(){await salvarAgora();const ps=(await DB.todos('projetos')).sort((a,b)=>b.atualizado-a.atualizado);
  const d=dialogo('<h3>Abrir projeto</h3><div class="lstP" id="lstP"></div><div class="dica" id="abNv" style="padding:6px 2px">Consultando a nuvem…</div><div class="acoes"><button class="bt" onclick="fecharDialogo()">Fechar</button><button class="bt pri" id="abNovo">Novo projeto</button></div>');
  const itens=new Map();for(const p of ps)itens.set(p.id,{id:p.id,nome:p.nome,local:p,tL:p.atualizado,tN:0,info:`${p.seq.w}×${p.seq.h} · ${p.clips.length} clipes`});
  const desenhar=()=>{d.querySelector('#lstP').innerHTML=[...itens.values()].sort((a,b)=>Math.max(b.tL,b.tN)-Math.max(a.tL,a.tN)).map(x=>{const nv=x.tN>x.tL+1000;
    return `<div class="it" data-id="${x.id}"><span class="nm"><b>${esc(x.nome)}</b><br><small>${x.info||'só na nuvem'} · ${new Date(Math.max(x.tL,x.tN)).toLocaleString('pt-BR')}</small></span>

    d.querySelectorAll('.it').forEach(it=>it.onclick=async()=>{const x=itens.get(it.dataset.id);let p=x.local;
      if(x.tN>x.tL+1000){try{toast('Baixando da nuvem…');p=await nuvemBaixar(x.id);await DB.put('projetos',p);}catch(e){toast('Não consegui baixar: '+e.message);if(!p)return;}}
      fecharDialogo();abrirProjeto(p);});};

async function excluirProjeto(){if(!confirm('Excluir o projeto “'+P.nome+'”? Os arquivos de vídeo no computador não são apagados.'))return;
  for(const m of P.midias)DB.del('arquivos',m.id).catch(()=>{});await DB.del('projetos',P.id);nuvemApagar(P.id).catch(()=>{});P=null;
  const ps=(await DB.todos('projetos')).sort((a,b)=>b.atualizado-a.atualizado);if(ps.length)abrirProjeto(ps[0]);else dlgNovoProjeto(false);}
const comPrazo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('o arquivo demorou demais para responder')),ms))]);
async function abrirProjeto(p){pararReproducao();limparElems();P=p;if(!P.marcadores)P.marcadores=[];if(P.entrada===undefined){P.entrada=null;P.saida=null;}
  for(const tr of[...P.vT,...P.aT])if(!P.trilhas[tr])P.trilhas[tr]=ehV(tr)?{olho:true,trava:false}:{mudo:false,solo:false,trava:false};
  arquivos.clear();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();imagens.clear();handles.clear();sel.clear();foco=null;desfazerPilha=[];refazerPilha=[];
  T=P.T||0;pps=P.pps||40;$('#zoom').value=sliderDePps(pps);$('#tituloProj').textContent=P.nome;
  // 1º desenha a tela; depois procura os arquivos (um disco externo dormindo não pode travar a abertura)
  renderBin();renderMarcadores();renderTimeline();renderProps();ajustarMonitor();sujo=true;DB.put('config',{k:'ultimo',v:P.id}).catch(()=>{});
  const id=P.id;$('#stInfo').textContent='Procurando as filmagens…';
  await Promise.all(P.midias.map(async m=>{try{
    if(m.opfs){const pasta=await pastaInterna();registrarArquivo(m,await comPrazo((await pasta.getFileHandle(m.opfs)).getFile(),8000));return;}
    const r=await comPrazo(DB.get('arquivos',m.id),5000);if(r&&r.handle){handles.set(m.id,r.handle);
      if((await comPrazo(r.handle.queryPermission({mode:'read'}),5000))==='granted')registrarArquivo(m,await comPrazo(r.handle.getFile(),8000));}}catch(e){}}));
  $('#stInfo').textContent='';if(!P||P.id!==id)return;
  renderBin();renderTimeline();sujo=true;
  const off=P.midias.filter(m=>!arquivos.has(m.id)).length;
  filaPicos(P.midias);}

function salvarArquivoProjeto(){salvarAgora();const s=JSON.stringify(Object.assign(clonar(P),{_opsis:APP_VERSION}));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download=P.nome.replace(/[\\/:*?"<>|]+/g,'-')+'.opsis';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Cópia do projeto salva em Downloads. Guarde junto com as filmagens.',5000);}
function abrirArquivoProjeto(){const i=document.createElement('input');i.type='file';i.accept='.opsis,.json,application/json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p.seq||!Array.isArray(p.clips))throw new Error('não é um projeto do Ópsis');
      const existe=await DB.get('projetos',p.id);if(existe){p.id=uid();p.nome+=' (cópia)';}delete p._opsis;p.atualizado=Date.now();
      for(const m of p.midias){const r=await DB.get('arquivos',m.id).catch(()=>null);if(r&&existe){/* mantém o vínculo do projeto original */}}
      await DB.put('projetos',p);await salvarAgora();await abrirProjeto(p);toast('Projeto aberto. Se pedir, use “Reconectar” para localizar as filmagens.',6000);}
    catch(e){toast('Não consegui abrir: '+(e.message||e),5000);}};i.click();}

  const l=nivelDe(anL),r=nivelDe(anR);picoL=Math.max(l,picoL-0.6);picoR=Math.max(r,picoR-0.6);const top=8,bot=H-16,y=db=>top+(bot-top)*(-db/60);

/* mistura o áudio da sequência em pedaços (usado na exportação e nas legendas) */
function criarMixer(B){const entradas=new Map(),leit=new Map();
  const inputDe=id=>{if(!entradas.has(id))entradas.set(id,new B.Input({source:new B.BlobSource(arquivos.get(id)),formats:B.ALL_FORMATS}));return entradas.get(id);};

    for(const c of P.clips){if(c.tipo!=='audio')continue;if(filtro?!filtro(c):!trilhaAudivel(c.trilha))continue;
      let a=Math.max(c0,c.start-trIn(c)),b=Math.min(c1,fimDe(c)+trOut(c));if(b-a<1e-4)continue;
      if(!arquivos.has(c.midia))continue;const m=midiaDe(c);
      let s0=c.in+(a-c.start)*c.vel,s1=c.in+(b-c.start)*c.vel;if(s0<0){a+=-s0/c.vel;s0=0;}if(m&&s1>m.dur){b-=(s1-m.dur)/c.vel;s1=m.dur;}if(b-a<1e-4)continue;
      let L=leit.get(c.id);if(!L){const at=await inputDe(c.midia).getPrimaryAudioTrack();if(!at)continue;L=new Leitor(new B.AudioBufferSink(at),Math.max(0,s0-0.05),c.in+(c.dur+trOut(c))*c.vel+0.3);L.sr=at.sampleRate;leit.set(c.id,L);}
      let buf,taxa=c.vel;
      if(c.vel!==1&&c.tom!==false){ // muda a velocidade sem mudar o tom
        let E=L.est;if(!E){E=L.est=new Esticador(L,s0,c.vel,L.sr);E.a0=a;}const n=Math.round((b-E.a0)*L.sr)-E.feitos;if(n<=0)continue;
        const can=await E.produzir(n);buf=off.createBuffer(can.length,n,L.sr);can.forEach((d,i)=>buf.copyToChannel(d,i));taxa=1;a=b-n/L.sr;}
      else{const seg=await L.ler(s0,s1);if(!seg)continue;buf=off.createBuffer(seg.canais.length,seg.n,seg.sr);seg.canais.forEach((d,i)=>buf.copyToChannel(d,i));}
      const src=off.createBufferSource();src.buffer=buf;src.playbackRate.value=taxa;const gn=off.createGain();
      const np=Math.max(2,Math.ceil((b-a)*60)),curva=new Float32Array(np);for(let i=0;i<np;i++){const tt=a+(b-a)*i/(np-1);curva[i]=dbLin(c.p.nivel)*envelope(c,tt)*(filtro?1:fatorDuck(c.trilha,tt));}
      gn.gain.setValueCurveAtTime(curva,a-c0,b-a);src.connect(gn);
      if(canais>1){const pn=off.createStereoPanner();pn.pan.value=c.p.pan/100;gn.connect(pn).connect(off.destination);}else gn.connect(off.destination);
      src.start(a-c0);}
    return off.startRendering();}
  mixar.inputDe=inputDe;return mixar;}
async function exportar({nome,W,H,q,alvo,faixa},prog){

  const bitrate=Math.round(W*H*fps*q);let vc='avc',fmt='mp4',output=null;
  try{
    if(!await B.canEncodeVideo('avc',{width:W,height:H,bitrate})){if(await B.canEncodeVideo('vp9',{width:W,height:H,bitrate})){vc='vp9';fmt='webm';}else throw new Error('este navegador não consegue gerar vídeo. Use o Google Chrome atualizado.');}
    let ac=fmt==='mp4'?'aac':'opus';if(!await B.canEncodeAudio(ac,{numberOfChannels:2,sampleRate:48000,bitrate:192000}))ac=(await B.canEncodeAudio('opus',{numberOfChannels:2,sampleRate:48000,bitrate:192000}))?'opus':null;
    let writable=null,target;
    if(alvo&&alvo.h&&fmt==='mp4'){writable=await alvo.h.createWritable();target=new B.StreamTarget(writable);}else target=new B.BufferTarget();

    const vSrc=new B.CanvasSource(cv,{codec:vc,bitrate,keyFrameInterval:2});output.addVideoTrack(vSrc,{frameRate:fps});

      const r=await it.g.next();if(r.value)it.ult=r.value.canvas;return it.ult?{img:it.ult,w:it.ult.width,h:it.ult.height}:null;}
    const CHF=4*fps,inicio=performance.now();

        for(const tr of P.vT){if(!P.trilhas[tr].olho)continue;for(const c of P.clips){if(c.trilha!==tr||!visivelEm(c,t))continue;
          if(c.tipo==='video')fontes.set(c.id,await quadroDe(c));else if(c.tipo==='imagem'){const im=imagens.get(c.midia);if(im)fontes.set(c.id,{img:im,w:im.naturalWidth,h:im.naturalHeight});}}}
        compor(g,W,H,t,c=>fontes.get(c.id));await vSrc.add((f-fA)/fps,1/fps);
        if(f%10===0){const p=(f-fA+1)/total,el=(performance.now()-inicio)/1000,rest=p>0.01?el/p-el:0;prog(p,`Exportando… ${(p*100).toFixed(1)}% · ${tc(t-A)} de ${tc(Z-A)}${rest?` · faltam ~${rest>90?Math.round(rest/60)+' min':Math.round(rest)+' s'}`:''}`);}}
      for(const[id,it]of its){const c=P.clips.find(x=>x.id===id);if(c&&fimDe(c)+trOut(c)<=c1){it.g.return&&it.g.return();its.delete(id);}}}
    prog(1,'Finalizando o arquivo…');await output.finalize();
    if(!writable){const blob=new Blob([target.buffer],{type:fmt==='mp4'?'video/mp4':'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome+'.'+fmt;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},60000);}
    if(fmt!=='mp4')toast('Este navegador não gera MP4; o vídeo saiu em WebM. Use o Google Chrome para MP4.',7000);
  }catch(e){try{if(output)await output.cancel();}catch(x){}throw e;}
  finally{exportando=false;}}
class Leitor{constructor(sink,ini,fim){this.it=sink.buffers(ini,fim);this.fila=[];this.fim=false;}
  async ler(s0,s1){while(!this.fim&&(!this.fila.length||(()=>{const u=this.fila[this.fila.length-1];return u.timestamp+u.duration<s1;})())){const r=await this.it.next();if(r.done){this.fim=true;break;}
      const w=r.value;if(w.timestamp+w.duration<s0-0.01)continue;this.fila.push(w);}
    if(!this.fila.length)return null;const sr=this.fila[0].buffer.sampleRate,nc=Math.max(...this.fila.map(w=>w.buffer.numberOfChannels));const n=Math.max(1,Math.round((s1-s0)*sr));
    const canais=Array.from({length:nc},()=>new Float32Array(n));
    for(const w of this.fila){const b=w.buffer,off=Math.round((w.timestamp-s0)*sr),i0=Math.max(0,-off),i1=Math.min(b.length,n-off);if(i1<=i0)continue;
      for(let ch=0;ch<nc;ch++)canais[ch].set(b.getChannelData(Math.min(ch,b.numberOfChannels-1)).subarray(i0,i1),off+i0);}

let MARCA=MARCA_PADRAO;const imgsMarca={};

const MODELOS={
  tarja:{nome:'Tarja com nome e cargo',dur:6,campos:{l1:'Bispo Enéas Araújo',l2:'Igreja Vidas',estilo:'claro'}},
  versiculo:{nome:'Versículo na tela',dur:8,campos:{texto:'Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna.',ref:'João 3:16'}},

function posModelo(c){const W=P.seq.w,H=P.seq.h,v=H>W,g=c.g;
  if(g.modelo==='tarja'){c.p.x=W*(v?0.07:0.06);c.p.y=H*(v?0.74:0.84);}
  else if(g.modelo==='logo'){const S=Math.min(W,H),m=S*0.045,im=imgsMarca[g.versao],lw=W*(v?0.22:0.12)*(g.versao==='simbolo'?1:1.25),lh=im&&im.naturalWidth?lw*im.naturalHeight/im.naturalWidth:lw*0.75;
    c.p.x=g.canto[1]==='d'?W-m-lw/2:m+lw/2;c.p.y=g.canto[0]==='s'?m+lh/2:H-m-lh/2;}
  else{c.p.x=W/2;c.p.y=H/2;}}
function quebrar(ctx,texto,max){const ls=[];for(const par of String(texto).split('\n')){let l='';for(const w of par.split(' ')){const t=l?l+' '+w:w;if(ctx.measureText(t).width>max&&l){ls.push(l);l=w;}else l=t;}ls.push(l);}return ls;}

  async garantir(ate){while(this.lido<ate){const n=Math.round(0.5*this.sr);let partes;
      if(!this.fim){const s=await this.L.ler(this.lido/this.sr,(this.lido+n)/this.sr);if(!s)this.fim=true;else partes=s.canais.map(x=>x.subarray(0,n));}
      if(!this.ent){this.nc=partes?partes.length:1;this.ent=Array.from({length:this.nc},()=>new Float32Array(0));this.acc=Array.from({length:this.nc},()=>new Float32Array(this.N));}
      this.ent=this.ent.map((e,i)=>{const d=partes?partes[Math.min(i,partes.length-1)]:new Float32Array(n);const z=new Float32Array(e.length+d.length);z.set(e);z.set(d,e.length);return z;});this.lido+=n;}}
  async quadro(){const{N,Ho,D,r}=this,tk=Math.max(this.ini,Math.round(this.base+this.k*Ho*r));let sel=tk;
    if(this.prev!=null){const nat=this.prev+Ho;await this.garantir(Math.max(nat,tk+D)+N+2);const m=this.ent[0],o=this.ini,lo=Math.max(this.ini,tk-D),hi=tk+D;
      let best=tk,bv=-Infinity;for(let c=lo;c<=hi;c+=8){let s=0;for(let i=0;i<N;i+=8)s+=m[nat+i-o]*m[c+i-o];if(s>bv){bv=s;best=c;}}
      const lo2=Math.max(lo,best-8),hi2=Math.min(hi,best+8);bv=-Infinity;for(let c=lo2;c<=hi2;c++){let s=0;for(let i=0;i<N;i+=2)s+=m[nat+i-o]*m[c+i-o];if(s>bv){bv=s;best=c;}}sel=best;}

async function detectarFala(tr,prog){const B=await mb(),mixar=criarMixer(B),SR=8000,J=160,D=durSeq(),dbs=[];

    for(let i=0;i+J<=x.length;i+=J){let s=0;for(let k=i;k<i+J;k++)s+=x[k]*x[k];dbs.push(s>0?10*Math.log10(s/J):-120);}prog(c1/D,'Escutando a voz… '+Math.round(c1/D*100)+'%');}
  const v=dbs.filter(x=>x>-90).sort((a,b)=>a-b);if(!v.length)throw new Error('não encontrei som na trilha '+tr);
  const piso=v[Math.floor(v.length*0.15)],pico=v[Math.floor(v.length*0.97)],lim=piso+clamp((pico-piso)*0.4,3,12);
  const pj=J/SR,ativo=dbs.map(x=>x>lim);const segs=[];let ini=-1,ultimo=-1;
  ativo.forEach((a,i)=>{if(a){if(ini<0)ini=i;ultimo=i;}else if(ini>=0&&(i-ultimo)*pj>0.35){segs.push([ini*pj,(ultimo+1)*pj+0.25]);ini=-1;}});
  if(ini>=0)segs.push([ini*pj,(ultimo+1)*pj+0.25]);
  const junt=[];for(const s of segs){const u=junt[junt.length-1];if(u&&s[0]-u[1]<0.5)u[1]=s[1];else junt.push(s);}
  return junt.filter(s=>s[1]-s[0]>0.25).map(s=>[+s[0].toFixed(3),+Math.min(D,s[1]).toFixed(3)]);}

function criarFFT(N){const lev=Math.log2(N),rev=new Uint32Array(N);for(let i=0;i<N;i++){let r=0;for(let b=0;b<lev;b++)r=(r<<1)|((i>>b)&1);rev[i]=r;}

  const d=dialogo(`<h3>💬 Legendas automáticas</h3>
    <div class="lin2"><label>O que legendar</label><select id="lgFaixa"><option value="tudo">Sequência inteira (${tc(D)})</option>${io?`<option value="io" selected>Só o trecho marcado: ${tc(io.a)} a ${tc(io.b)}</option>`:''}</select></div>
    <div class="lin2"><label>Estilo</label><select id="lgEst"><option value="reels" ${vert?'selected':''}>${ESTILOS_LEG.reels.nome}</option><option value="youtube" ${vert?'':'selected'}>${ESTILOS_LEG.youtube.nome}</option></select></div>
    <p>O app junta o áudio da linha do tempo, envia ao mesmo serviço de transcrição do SCRIBA e cria cada legenda como um clipe de texto numa <b>trilha nova no topo</b>. Depois dá para corrigir palavras, mudar o estilo de uma e aplicar a todas, ou excluir. Leva mais ou menos um quarto da duração do áudio.</p>
    <div id="lgProg" style="display:none"><div class="prog"><div></div></div><div id="lgTx"></div></div>
    <div class="acoes"><button class="bt" id="lgCanc">Fechar</button><button class="bt pri" id="lgOk">Gerar legendas</button></div>`,{fixo:true});
  d.querySelector('#lgCanc').onclick=()=>{if(legendando){cancelarLeg=true;d.querySelector('#lgTx').textContent='Cancelando…';}else fecharDialogo();};
  d.querySelector('#lgOk').onclick=async()=>{const f=d.querySelector('#lgFaixa').value==='io'?io:{a:0,b:D};const est=d.querySelector('#lgEst').value;
    d.querySelector('#lgOk').disabled=true;d.querySelector('#lgProg').style.display='block';d.querySelector('#lgCanc').textContent='Cancelar';legendando=true;
    try{const r=await gerarLegendas({a:f.a,b:f.b,estilo:est},(p,tx)=>{d.querySelector('.prog div').style.width=(p*100).toFixed(1)+'%';d.querySelector('#lgTx').textContent=tx;});
      d.querySelector('.prog div').style.width='100%';d.querySelector('#lgTx').innerHTML=`<b>Pronto!</b> ${r.n} legendas criadas na trilha <b>${r.tr}</b>. Toque numa delas para corrigir o texto ou mudar o estilo.`;}
    catch(e){console.error(e);d.querySelector('#lgTx').innerHTML='<b style="color:#e0604f">'+(cancelarLeg?'Cancelado.':'Não deu certo: '+esc(e.message||e))+'</b>';}
    legendando=false;d.querySelector('#lgCanc').textContent='Fechar';d.querySelector('#lgOk').disabled=false;};}
async function gerarLegendas({a,b,estilo},prog){const B=await mb();cancelarLeg=false;
  const parar=()=>{if(cancelarLeg)throw new Error('cancelado');};
  if(P.clips.some(c=>c.tipo==='audio'&&c.start<b&&fimDe(c)>a&&!arquivos.has(c.midia)))throw new Error('há mídias desconectadas. Use “Reconectar” primeiro.');
  // 1) áudio do trecho, em mono e compactado (Opus), para o envio ser leve
  prog(0.01,'Preparando o áudio…');const mixar=criarMixer(B);let blob;
  if(await B.canEncodeAudio('opus',{numberOfChannels:1,sampleRate:48000,bitrate:32000})){
    const target=new B.BufferTarget(),out=new B.Output({format:new B.WebMOutputFormat(),target});const aSrc=new B.AudioBufferSource({codec:'opus',bitrate:32000});out.addAudioTrack(aSrc);await out.start();
    for(let c0=a;c0<b-1e-6;c0+=30){parar();const c1=Math.min(b,c0+30);await aSrc.add(await mixar(c0,c1,1,48000));prog(0.01+0.19*(c1-a)/(b-a),'Preparando o áudio… '+Math.round((c1-a)/(b-a)*100)+'%');}
    await out.finalize();blob=new Blob([target.buffer],{type:'audio/webm'});}
  else{const partes=[];let n=0;for(let c0=a;c0<b-1e-6;c0+=30){parar();const c1=Math.min(b,c0+30);const r=await mixar(c0,c1,1,16000);const d=r.getChannelData(0),i16=new Int16Array(d.length);
      for(let i=0;i<d.length;i++)i16[i]=Math.max(-1,Math.min(1,d[i]))*32767;partes.push(i16);n+=i16.length;prog(0.01+0.19*(c1-a)/(b-a),'Preparando o áudio…');}
    const hd=new DataView(new ArrayBuffer(44)),ws=(o,s)=>[...s].forEach((ch,i)=>hd.setUint8(o+i,ch.charCodeAt(0)));
    ws(0,'RIFF');hd.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');hd.setUint32(16,16,true);hd.setUint16(20,1,true);hd.setUint16(22,1,true);hd.setUint32(24,16000,true);hd.setUint32(28,32000,true);hd.setUint16(32,2,true);hd.setUint16(34,16,true);ws(36,'data');hd.setUint32(40,n*2,true);
    blob=new Blob([hd,...partes],{type:'audio/wav'});}
  if(blob.size>78*1048576)throw new Error('o trecho é longo demais para enviar de uma vez. Marque um trecho menor com I e O.');
  // 2) envia e transcreve (mesmo Worker do SCRIBA)
  parar();prog(0.21,`Enviando o áudio (${tamTxt(blob.size)})…`);
  const up=await chamarW('/upload',{method:'POST',headers:{'Content-Type':'text/plain'},body:blob},600000);
  parar();const ini=await chamarW('/transcrever',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({audio_url:up.upload_url||up.url,falantes:null})},30000);
  let dados=null,seg=0,falhas=0;const esperado=(b-a)*0.3+20;
  while(seg<4*3600){parar();await pausa(3000);seg+=3;let j;
    try{j=await chamarW('/status?id='+encodeURIComponent(ini.id),{},30000);falhas=0;}catch(e){if(++falhas>=6)throw e;continue;}
    if(j.status==='completed'){dados=j;break;}if(j.status==='error')throw new Error(j.erro||'o serviço de transcrição retornou erro');
    prog(Math.min(0.93,0.25+0.68*seg/esperado),`Transcrevendo a fala… ${seg<60?seg+' s':Math.floor(seg/60)+' min '+(seg%60)+' s'}`);}
  if(!dados)throw new Error('a transcrição demorou demais');
  prog(0.96,'Criando as legendas…');
  const pal=extrairPalavras(dados,b-a).map(w=>({text:w.text,start:a+w.start,end:a+w.end})).filter(w=>w.start<b-0.05);
  if(!pal.length)throw new Error('não encontrei fala neste trecho');
  return criarClipesLegenda(pal,estilo,a,b);}
function extrairPalavras(d,dur){let ws=[];
  if(Array.isArray(d.words)&&d.words.length)ws=d.words;
  else if(Array.isArray(d.utterances))for(const u of d.utterances){if(Array.isArray(u.words)&&u.words.length)ws.push(...u.words);
    else if(u.text&&u.end>u.start){const tk=u.text.split(/\s+/).filter(Boolean),tot=tk.reduce((s,x)=>s+x.length+1,0);let t=u.start;for(const x of tk){const dd=(u.end-u.start)*(x.length+1)/tot;ws.push({text:x,start:t,end:t+dd});t+=dd;}}}
  if(!ws.length)return[];const maxF=Math.max(...ws.map(w=>+w.end||0));const k=maxF>dur*4+30?1/1000:1;
  return ws.map(w=>({text:String(w.text??w.word??'').trim(),start:(+w.start)*k,end:(+w.end)*k})).filter(w=>w.text&&isFinite(w.start)&&isFinite(w.end));}
const CONECTIVOS=new Set('e o a os as de da do das dos que em no na nos nas um uma para pra por com se mas ou ao à é'.split(' '));
function agruparPalavras(pal,e){const gr=[];let cur=[];const txt=g=>g.map(w=>w.text).join(' ');
  for(const w of pal){if(cur.length){const u=cur[cur.length-1];if((txt(cur)+' '+w.text).length>e.maxCar||w.start-u.end>0.7||w.end-cur[0].start>e.maxDur){
      // não deixa a legenda terminar numa palavrinha solta ("e", "de", "que"…): ela passa para a próxima
      const leva=[];while(cur.length>1&&CONECTIVOS.has(cur[cur.length-1].text.toLowerCase())&&w.start-cur[cur.length-1].end<0.5)leva.unshift(cur.pop());
      gr.push(cur);cur=leva;}}
    cur.push(w);if(/[.!?…]$/.test(w.text)&&cur.length>=2){gr.push(cur);cur=[];}else if(/[,;:]$/.test(w.text)&&txt(cur).length>e.maxCar*0.55){gr.push(cur);cur=[];}}
  if(cur.length)gr.push(cur);return gr;}
function duasLinhas(t,max){if(t.length<=max)return t;const ws=t.split(' ');let best=0,bd=1e9,acc=0;
  for(let i=0;i<ws.length-1;i++){acc+=ws[i].length+1;const d=Math.abs(acc-t.length/2);if(d<bd){bd=d;best=i;}}return ws.slice(0,best+1).join(' ')+'\n'+ws.slice(best+1).join(' ');}
function criarClipesLegenda(pal,estilo,a,b){const e=ESTILOS_LEG[estilo],vert=P.seq.h>P.seq.w,fps=P.seq.fps;marcar();
  P.clips=P.clips.filter(c=>!(c.legenda&&c.start<b&&fimDe(c)>a));
  let tr=[...P.vT].reverse().find(t=>P.clips.some(c=>c.trilha===t&&c.legenda));
  if(!tr){tr='V'+(P.vT.length+1);P.vT.push(tr);P.trilhas[tr]={olho:true,trava:false};}
  const gr=agruparPalavras(pal,e);let n=0;
  gr.forEach((g,i)=>{const s=quadro(Math.max(a,g[0].start));let f=g[g.length-1].end+0.3;if(f-s<0.6)f=s+0.6;const prox=gr[i+1];
    if(prox){if(prox[0].start-f<0.4)f=prox[0].start;f=Math.min(f,prox[0].start);}f=Math.min(quadro(f),quadro(b));if(f-s<1/fps)return;
    const frase=g.map(w=>w.text).join(' ');const c=novoClip('texto',tr,s,f-s,{legenda:true});
    Object.assign(c.txt,clonar(e.txt),{texto:e.linhas===2?duasLinhas(frase,Math.ceil(e.maxCar/2)):frase,tam:vert?e.txt.tamV:e.txt.tamH});delete c.txt.tamV;delete c.txt.tamH;
    c.p.y=P.seq.h*(vert?e.yV:e.yH);c.palavras=g.map(w=>({i:+Math.max(0,w.start-s).toFixed(3),f:+Math.max(0.05,w.end-s).toFixed(3)}));P.clips.push(c);n++;});
  posMudanca();return{n,tr};}
function aplicarEstiloLegendas(ref){marcar();for(const c of P.clips){if(!c.legenda||c===ref)continue;const t=c.txt.texto;c.txt=Object.assign(clonar(ref.txt),{texto:t});
    c.p.x=ref.p.x;c.p.y=ref.p.y;c.p.escala=ref.p.escala;c.p.opac=ref.p.opac;c.p.rot=ref.p.rot;c.p.fadeIn=ref.p.fadeIn;c.p.fadeOut=ref.p.fadeOut;}
  posMudanca();toast('Estilo aplicado a todas as legendas.');}
function excluirLegendas(){const n=P.clips.filter(c=>c.legenda).length;if(!n)return;if(!confirm(`Excluir as ${n} legendas?`))return;mudar(()=>{P.clips=P.clips.filter(c=>!c.legenda);sel.clear();});}
function exportarSRT(){let ls=P.clips.filter(c=>c.legenda).sort((x,y)=>x.start-y.start);if(!ls.length)return toast('Não há legendas automáticas neste projeto.');
  const io=faixaIO();let base=0;
  if(io&&confirm('Exportar só as legendas do trecho marcado (entrada a saída), com os tempos contando do início do trecho?\n\nOK = só o trecho · Cancelar = a sequência inteira')){ls=ls.filter(c=>fimDe(c)>io.a&&c.start<io.b);base=io.a;}
  const f=t=>{const ms=Math.max(0,Math.round(t*1000));return pad(Math.floor(ms/3600000))+':'+pad(Math.floor(ms/60000)%60)+':'+pad(Math.floor(ms/1000)%60)+','+String(ms%1000).padStart(3,'0');};
  const srt=ls.map((c,i)=>`${i+1}\n${f(c.start-base)} --> ${f(fimDe(c)-base)}\n${c.txt.texto}\n`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([srt],{type:'text/plain;charset=utf-8'}));a.download=P.nome.replace(/[\\/:*?"<>|]+/g,'-')+'.srt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Arquivo .srt salvo em Downloads. No YouTube Studio: Legendas › Adicionar › Enviar arquivo.',7000);}
$('#gLeg').onclick=()=>dlgLegendas();$('#gDuck').onclick=dlgDucking;

/* ===================== teclado ===================== */
document.addEventListener('keydown',e=>{if(gravandoAgora&&(e.key===' '||e.key==='Escape')){e.preventDefault();pararGravacao();return;}if(!P||dlgAberto)return;const a=document.activeElement;if(a&&(/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&a.type!=='range')return;
  const cmd=e.metaKey||e.ctrlKey,k=e.key.toLowerCase(),fps=P.seq.fps;let ok=true;
  if(e.key===' '){tocarPausar();}
  else if(cmd&&k==='z'){e.shiftKey?refazer():desfazer();}else if(cmd&&k==='y'){refazer();}
  else if(cmd&&k==='k'){dividirNoIndicador();}else if(cmd&&k==='c'){copiar(false);}else if(cmd&&k==='x'){copiar(true);}else if(cmd&&k==='v'){colar();}
  else if(cmd&&k==='a'){if(e.shiftKey){sel.clear();renderTimeline();renderProps();}else selTudo();}
  else if(cmd&&k==='d'){aplicarTransicaoIndicador(e.shiftKey?'preto':'dissolver');}
  else if(cmd&&k==='l'){alternarVinculo();}else if(cmd&&k==='s'){salvarAgora();toast('Projeto salvo.');}
  else if(cmd&&k==='i'){$('#btImportar').click();}else if(cmd&&e.shiftKey&&k==='m'){proxMarcador(-1);}else if(cmd&&k==='m'){dlgExportar();}
  else if(cmd){ok=false;}
  else if(e.key==='Delete'||e.key==='Backspace'){excluirSelecao(e.shiftKey);}
  else if(e.key==='ArrowLeft'){pararReproducao();irPara(quadro(T)-(e.shiftKey?1:1/fps));}
  else if(e.key==='ArrowRight'){pararReproducao();irPara(quadro(T)+(e.shiftKey?1:1/fps));}
  else if(e.key==='ArrowUp'){const p=pontosEdicao().filter(x=>x<T-1e-4);irPara(p.length?p[p.length-1]:0);}
  else if(e.key==='ArrowDown'){const p=pontosEdicao().find(x=>x>T+1e-4);if(p!=null)irPara(p);}
  else if(e.key==='Home'){irPara(0);}else if(e.key==='End'){irPara(durSeq());}
  else if(e.altKey&&e.code==='KeyX'){limparIO();}
  else if(k==='i'){e.shiftKey?(P.entrada!=null&&irPara(P.entrada)):definirEntrada(T);}
  else if(k==='o'){e.shiftKey?(P.saida!=null&&irPara(P.saida)):definirSaida(T);}
  else if(k==='m'){e.shiftKey?proxMarcador(1):addMarcador(T);}
  else if(k==='v'){definirFerramenta('sel');}else if(k==='c'){definirFerramenta('nav');}else if(k==='t'){definirFerramenta('txt');}
  else if(k==='s'){$('#gSnap').click();}else if(k==='k'){pararReproducao();}else if(k==='l'){if(!tocando)tocar();}else if(k==='j'){irPara(T-5);}
  else if(e.key==='+'||e.key==='='){definirZoom(pps*1.5);}else if(e.key==='-'){definirZoom(pps/1.5);}else if(e.key==='\\'){zoomTudo();}
  else if(e.key==='F1'||(e.key==='?'&&e.shiftKey)){dlgManual();}
  else if(e.key==='Escape'){sel.clear();renderTimeline();renderProps();definirFerramenta('sel');}
  else ok=false;
  if(ok)e.preventDefault();});

/* ===================== início ===================== */
(async function iniciar(){
  try{if(localStorage.getItem('opsis-tema')==='claro')aplicarTema(true);const h=localStorage.getItem('opsis-hsup');if(h)document.documentElement.style.setProperty('--hSup',h);}catch(e){}
  definirFerramenta('sel');requestAnimationFrame(laco);
  try{const mk=await DB.get('config','marca');carregarMarca(mk&&mk.v);}catch(e){carregarMarca(null);}
  let p=null;try{const u=await DB.get('config','ultimo');if(u)p=await DB.get('projetos',u.v);if(!p){const ps=await DB.todos('projetos');p=ps.sort((a,b)=>b.atualizado-a.atualizado)[0];}}catch(e){console.error(e);}
  // se a nuvem tiver uma versão mais nova deste projeto (editado em outro computador), usa a da nuvem
  try{await new Promise(r=>setTimeout(r,800));const nv=await nuvemLista();if(nv&&nv.length){nuvemEstado='ok';if(p){const r=nv.find(x=>x.id===p.id);if(r&&Date.parse(r.atualizado)>p.atualizado+1000){p=await nuvemBaixar(p.id);await DB.put('projetos',p);toast('Abri a versão mais nova deste projeto, que estava na nuvem.',5000);}}
    else{p=await nuvemBaixar(nv[0].id);await DB.put('projetos',p);}}}catch(e){console.warn(e);}
  if(p)abrirProjeto(p);else dlgNovoProjeto(false);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();
