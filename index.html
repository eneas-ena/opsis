<style>
:root{
  --bg:#1b1b1b; --p:#232323; --p2:#2c2c2c; --p3:#363636; --borda:#3b3b3b; --linha:#141414;
  --tx:#d8d8d8; --tx2:#8e8e8e; --azul:#4f9dff; --ouro:#C9A227;
  --cV:#3d6fa6; --cA:#3e7b45; --cT:#8b4fa3; --cI:#5d63b5; --pista:#262626; --pista2:#2a2a2a;
}
body.claro{
  --bg:#d9d9d9; --p:#f3f3f3; --p2:#e6e6e6; --p3:#d6d6d6; --borda:#c4c4c4; --linha:#bdbdbd;
  --tx:#1e1e1e; --tx2:#666; --azul:#1f6fd6; --ouro:#9b7a12; --pista:#ececec; --pista2:#e4e4e4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{background:var(--bg);color:var(--tx);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--borda);border-radius:4px;padding:4px 6px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--azul)}
#app{display:grid;grid-template-rows:34px var(--hSup,56vh) 5px 1fr 22px;height:100vh}
/* topo */
#topo{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--p);border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:center;gap:7px;margin-right:6px}
.marca img{width:22px;height:22px;border-radius:5px}
.marca b{font-family:Cinzel,serif;color:var(--ouro);letter-spacing:2px;font-size:14px}
.ver{font-size:10px;color:var(--tx2);border:1px solid var(--borda);border-radius:9px;padding:0 6px}
.mbt{background:none;border:none;padding:5px 8px;border-radius:4px;cursor:pointer;color:var(--tx)}
.mbt:hover{background:var(--p3)}
.abas{display:flex;gap:2px;margin-left:16px}
.abas button{background:none;border:none;padding:5px 10px;cursor:pointer;color:var(--tx2);font-size:13px}
.abas button.on{color:var(--tx);text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--azul)}
#tituloProj{flex:1;text-align:center;color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#salvoTx{color:var(--tx2);font-size:11px;margin-right:6px}
.ico{width:28px;height:26px;border:1px solid var(--borda);background:var(--p2);border-radius:5px;cursor:pointer;display:grid;place-items:center;font-size:13px}
.ico:hover{border-color:var(--azul)}
/* painéis */
#paineis{display:grid;grid-template-columns:var(--wEsq,300px) 1fr var(--wDir,330px);gap:2px;min-height:0;background:var(--linha)}
.painel{background:var(--p);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-bottom:1px solid var(--linha);color:var(--tx);flex:none}
.ph .t{font-weight:600}
.ph .sp{flex:1}
.pb{flex:1;overflow:auto;min-height:0}
/* bin */
.bt{background:var(--p2);border:1px solid var(--borda);border-radius:4px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.bt:hover{border-color:var(--azul)}
.bt.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.bt:disabled{opacity:.4;cursor:default}
#bin{padding:4px}
.mi{display:flex;align-items:center;gap:8px;padding:4px;border-radius:4px;cursor:grab}
.mi:hover{background:var(--p2)}
.mi.sel{background:var(--p3)}
.mi .th{width:64px;height:36px;border-radius:3px;background:#000 center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:16px;color:#ccc}
.mi .nm{flex:1;min-width:0}
.mi .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .nm small{color:var(--tx2)}
.mi.off .nm b{color:#e0604f}
.mi.off .th{outline:2px solid #e0604f}
#bin.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
#bin.grade .mi{flex-direction:column;align-items:stretch;gap:3px}
#bin.grade .mi .th{width:100%;height:64px}
.vazioBin{color:var(--tx2);padding:18px;text-align:center;line-height:1.6}
/* monitor */
#monArea{flex:1;display:grid;place-items:center;min-height:0;background:var(--bg);overflow:hidden;position:relative}
#mon{background:#000;box-shadow:0 0 0 1px #000}
.monBarra{display:flex;align-items:center;gap:8px;padding:4px 10px;flex:none}
.tc{font-variant-numeric:tabular-nums;color:var(--azul);font-size:15px;cursor:text}
#monScrub{height:16px;margin:0 10px;position:relative;cursor:pointer;flex:none}
#monScrub .tr{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--p3)}
#monScrub .ph2{position:absolute;top:0;width:2px;height:16px;background:var(--azul)}
.transporte{display:flex;justify-content:center;gap:4px;padding:4px 0 8px;flex:none}
.transporte button{width:32px;height:28px;border:none;background:none;cursor:pointer;border-radius:4px;font-size:14px}
.transporte button:hover{background:var(--p3)}
.transporte .play{font-size:16px;color:var(--tx)}
/* propriedades */
#props{padding:6px 8px 20px}
.sec{border-bottom:1px solid var(--borda);padding:4px 0 8px}
.sec h4{margin:4px 0 4px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.sec h4 .rs{margin-left:auto;font-weight:400;color:var(--tx2);cursor:pointer;padding:0 4px}
.sec h4 .rs:hover{color:var(--azul)}
.sec.fechada .cont{display:none}
.lp{display:flex;align-items:center;gap:6px;padding:3px 0 3px 14px;min-height:24px}
.lp>label{width:118px;color:var(--tx2);flex:none}
.num{color:var(--azul);cursor:ew-resize;font-variant-numeric:tabular-nums;padding:1px 3px;border-radius:3px}
.num:hover{background:var(--p2)}
.lp input[type=range]{flex:1;accent-color:var(--azul)}
.lp input.ed{width:70px}
.nomeClip{font-weight:600;padding:4px 0 6px;display:flex;gap:6px;align-items:center}
.nomeClip i{width:10px;height:10px;border-radius:2px;display:inline-block}
.dica{color:var(--tx2);line-height:1.6;padding:10px 4px}
.dica kbd,.kbd{background:var(--p3);border:1px solid var(--borda);border-radius:3px;padding:0 4px;font:11px ui-monospace,monospace;color:var(--tx)}
.botoes{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px 14px}
textarea.txt{width:100%;min-height:70px;resize:vertical}
/* divisor */
#divisor{background:var(--linha);cursor:ns-resize}
#divisor:hover{background:var(--azul)}
/* linha do tempo */
#pTl{display:grid;grid-template-columns:38px 1fr 58px;gap:2px;background:var(--linha);min-height:0}
#ferr{background:var(--p);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:34px}
#ferr button{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:5px;cursor:pointer;font-size:15px}
#ferr button.on{background:var(--azul);color:#fff}
#ferr button:hover{border-color:var(--borda)}
#tlWrap{background:var(--p);display:flex;flex-direction:column;min-width:0;min-height:0}
#tlTopo{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-bottom:1px solid var(--linha);flex:none}
#tlTopo .tc{font-size:16px;width:110px}
.tg{height:24px;min-width:26px;border:1px solid var(--borda);background:var(--p2);border-radius:4px;cursor:pointer;padding:0 6px}
.tg.on{background:var(--p3);border-color:var(--azul);color:var(--azul)}
#zoom{width:150px;accent-color:var(--azul)}
#tl{flex:1;overflow:auto;position:relative;min-height:0;background:var(--pista)}
.lin{display:flex;position:relative}
.cab{position:sticky;left:0;z-index:5;width:150px;flex:none;background:var(--p);border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:4px;padding:0 6px}
.cab .tn{width:26px;height:22px;border-radius:3px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:none}
.cab.v .tn{background:#3b5fa0}.cab.a .tn{background:#3b7a48}
.cab .tb{width:22px;height:20px;border:none;background:none;cursor:pointer;border-radius:3px;font-size:11px;color:var(--tx2);padding:0}
.cab .tb.on{color:#fff;background:#b8862d}
.cab .tb.mute.on{background:#b5562d}.cab .tb.solo.on{background:#c9a227;color:#111}
.cab .nmT{flex:1;color:var(--tx2);font-size:11px;white-space:nowrap;overflow:hidden}
.pista{position:relative;border-bottom:1px solid var(--linha);background:var(--pista)}
.lin.av .pista{background:var(--pista2)}
.lin.regua{position:sticky;top:0;z-index:8;height:26px}
.lin.regua .cab{z-index:9;justify-content:center;color:var(--tx2)}
.lin.regua .pista{background:var(--p)}
#regua{position:sticky;left:150px;display:block;height:26px}
.lin.trv{height:54px}.lin.tra{height:54px}
.sepVA{height:4px;background:var(--linha)}
.clip{position:absolute;top:2px;bottom:2px;border-radius:3px;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.5)}
.clip.video{background:var(--cV)}.clip.audio{background:var(--cA)}.clip.texto{background:var(--cT)}.clip.imagem{background:var(--cI)}
.clip.sel{outline:2px solid #fff;outline-offset:-2px;z-index:2}
body.claro .clip.sel{outline-color:#111}
.clip .fundo{position:absolute;left:0;right:0;top:15px;bottom:0;background-repeat:repeat-x;background-size:auto 100%;opacity:.85}
.clip canvas.onda{position:absolute;left:0;top:15px;width:100%;height:calc(100% - 15px)}
.clip .rot{position:absolute;left:4px;right:4px;top:1px;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px #000;pointer-events:none}
.clip .fx{position:absolute;top:0;bottom:0;pointer-events:none;background:rgba(0,0,0,.35)}
.clip .fx.e{left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.clip .fx.d{right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.clip .borda{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3}
.clip .borda.e{left:0}.clip .borda.d{right:0}
.clip .borda:hover{background:rgba(255,255,255,.25)}
.clip.off{background:#7a2d2d}
#tl.navalha .clip,#tl.navalha .clip .borda{cursor:crosshair}
#tl.texto .pista{cursor:copy}
#ph{position:absolute;top:0;width:1px;background:var(--azul);z-index:7;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:6px solid transparent;border-top:9px solid var(--azul)}
#snapLin{position:absolute;top:0;width:1px;background:#ffde4a;z-index:7;pointer-events:none;display:none}
#medidor{background:var(--p);display:flex;flex-direction:column;align-items:center;padding:6px 0}
#vu{flex:1;width:52px}
#status{background:var(--p);border-top:1px solid var(--linha);color:var(--tx2);padding:0 10px;display:flex;align-items:center;font-size:11px;gap:12px}
#status .sp{flex:1}
/* menus e diálogos */
.menu{position:fixed;z-index:1000;background:var(--p2);border:1px solid var(--borda);border-radius:6px;padding:4px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu div{padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;gap:12px}
.menu div:hover{background:var(--azul);color:#fff}
.menu div.dis{opacity:.4;pointer-events:none}
.menu div span.k{margin-left:auto;color:var(--tx2)}
.menu div:hover span.k{color:#fff}
.menu hr{border:none;border-top:1px solid var(--borda);margin:4px 0}
.fundoDlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:grid;place-items:center}
.dlg{background:var(--p);border:1px solid var(--borda);border-radius:10px;padding:18px 20px;width:min(520px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 12px;font-size:15px}
.dlg .lin2{display:flex;align-items:center;gap:10px;margin:8px 0}
.dlg .lin2>label{width:120px;color:var(--tx2)}
.dlg .lin2>input,.dlg .lin2>select{flex:1}
.dlg .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg p{color:var(--tx2);line-height:1.5}
.prog{height:8px;background:var(--p3);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.prog div{height:100%;width:0;background:var(--azul)}
.lstP{max-height:320px;overflow:auto}
.lstP .it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer}
.lstP .it:hover{background:var(--p2)}
.lstP .it .nm{flex:1}
.lstP .it small{color:var(--tx2)}
#toast{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--azul);padding:8px 14px;border-radius:6px;z-index:1100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw}
#toast.on{opacity:1}
#arrastoGhost{position:fixed;z-index:1000;pointer-events:none;background:var(--azul);color:#fff;padding:4px 8px;border-radius:4px;opacity:.85;display:none}
#ocultos{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none}
.atalhos td{padding:3px 10px 3px 0}
.atalhos td:first-child{white-space:nowrap}
</style>
</head>

        <button id="tProx" title="Próximo quadro (→)">|▶︎</button>
        <button id="tFim" title="Ir para o fim (End)">⏭</button>
        <button id="tQuadro" title="Exportar quadro atual como imagem PNG">📷</button>
      </div>
    </section>
    <section class="painel" id="pProps">

      <div class="pb"><div id="props"></div></div>

        <button class="tg" id="gAddA" title="Adicionar trilha de áudio">＋A</button>
        <span style="flex:1"></span>
        <button class="tg" id="zMenos" title="Afastar (-)">－</button>
        <input type="range" id="zoom" min="0" max="1000" value="500">
        <button class="tg" id="zMais" title="Aproximar (+)">＋</button>
        <button class="tg" id="zTudo" title="Ver a sequência inteira (\)">⤢</button>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const dbLin=db=>db<=-59.9?0:Math.pow(10,db/20);
const tick=()=>new Promise(r=>setTimeout(r,0));
const pad=n=>String(n).padStart(2,'0');
const CAB=150;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms);}
function tc(t,fps){fps=fps||(P?P.seq.fps:30);const f=Math.round(Math.max(0,t)*fps),fr=f%fps,s=Math.floor(f/fps);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)+':'+pad(fr);}
function lerTC(str){const fps=P.seq.fps;const p=String(str).trim().split(/[:;.,]/).map(Number);if(p.some(isNaN))return null;
  while(p.length<4)p.unshift(0);const[h,m,s,f]=p.slice(-4);return h*3600+m*60+s+f/fps;}
const quadro=t=>Math.round(t*P.seq.fps)/P.seq.fps;
function tamTxt(b){return b>1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(0)+' MB';}

const DB={db:null,
  async abrir(){if(this.db)return this.db;this.db=await new Promise((ok,er)=>{const r=indexedDB.open('opsis',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projetos',{keyPath:'id'});d.createObjectStore('arquivos',{keyPath:'id'});d.createObjectStore('config',{keyPath:'k'});};
    r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error);});return this.db;},
  async op(st,modo,fn){const d=await this.abrir();return new Promise((ok,er)=>{const t=d.transaction(st,modo);const q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>er(t.error);});},
  get(st,k){return this.op(st,'readonly',s=>s.get(k));}, todos(st){return this.op(st,'readonly',s=>s.getAll());},
  put(st,v){return this.op(st,'readwrite',s=>s.put(v));}, del(st,k){return this.op(st,'readwrite',s=>s.delete(k));}
};

const travada=tr=>P.trilhas[tr]&&P.trilhas[tr].trava;
const grupoDe=c=>(vinculado&&c.grupo)?P.clips.filter(x=>x.grupo===c.grupo):[c];
function trilhaAudivel(tr){const s=P.aT.some(a=>P.trilhas[a].solo);const o=P.trilhas[tr];return !o.mudo&&(!s||o.solo);}
function propsPadrao(tipo){if(tipo==='audio')return{nivel:0,pan:0,fadeIn:0,fadeOut:0};
  return{x:P.seq.w/2,y:P.seq.h/2,escala:100,rot:0,opac:100,cortE:0,cortS:0,cortD:0,cortI:0,brilho:0,contraste:0,saturacao:0,temperatura:0,matiz:0,fadeIn:0,fadeOut:0};}
function novoClip(tipo,trilha,start,dur,extra){const c={id:uid(),tipo,trilha,start,dur,in:0,vel:1,midia:null,grupo:null,p:propsPadrao(tipo)};
  if(tipo==='texto'){c.txt={texto:'Seu texto aqui',fonte:'Inter',tam:90,cor:'#ffffff',negrito:true,fundo:false,corFundo:'#000000',opFundo:60,alinh:'center',sombra:true};}
  return Object.assign(c,extra||{});}
const clonar=o=>JSON.parse(JSON.stringify(o));

/* ===================== desfazer ===================== */
const instantaneo=()=>JSON.stringify({clips:P.clips,vT:P.vT,aT:P.aT,trilhas:P.trilhas});
function marcar(){desfazerPilha.push(instantaneo());if(desfazerPilha.length>150)desfazerPilha.shift();refazerPilha=[];}
function restaurar(s){const o=JSON.parse(s);P.clips=o.clips;P.vT=o.vT;P.aT=o.aT;P.trilhas=o.trilhas;
  sel=new Set([...sel].filter(id=>P.clips.some(c=>c.id===id)));limparElems();posMudanca();}
function desfazer(){if(!desfazerPilha.length)return toast('Nada para desfazer.');refazerPilha.push(instantaneo());restaurar(desfazerPilha.pop());}
function refazer(){if(!refazerPilha.length)return;desfazerPilha.push(instantaneo());restaurar(refazerPilha.pop());}
function mudar(fn){marcar();fn();posMudanca();}
function posMudanca(){salvarDepois();renderTimeline();renderProps();sujo=true;}
let tSalvar=null;
function salvarDepois(){if(!P)return;$('#salvoTx').textContent='Salvando…';clearTimeout(tSalvar);tSalvar=setTimeout(salvarAgora,700);}
async function salvarAgora(){if(!P)return;clearTimeout(tSalvar);P.T=T;P.pps=pps;P.atualizado=Date.now();
  try{await DB.put('projetos',JSON.parse(JSON.stringify(P)));await DB.put('config',{k:'ultimo',v:P.id});$('#salvoTx').textContent='Salvo';}
  catch(e){$('#salvoTx').textContent='Erro ao salvar';console.error(e);}}

/* ===================== edição ===================== */
function sobrescrever(tr,a,b,ignorar){
  for(const c of [...P.clips]){
    if(c.trilha!==tr||ignorar.has(c.id))continue;const ca=c.start,cb=fimDe(c);
    if(cb<=a+1e-6||ca>=b-1e-6)continue;
    if(ca>=a-1e-6&&cb<=b+1e-6){P.clips.splice(P.clips.indexOf(c),1);sel.delete(c.id);}
    else if(ca<a&&cb>b){const r=clonar(c);r.id=uid();r.grupo=null;r.start=b;r.in=c.in+(b-ca)*c.vel;r.dur=cb-b;r.p.fadeIn=0;c.dur=a-ca;c.p.fadeOut=0;P.clips.push(r);}
    else if(ca<a){c.dur=a-ca;c.p.fadeOut=Math.min(c.p.fadeOut,c.dur);}
    else{const corte=b-ca;c.in+=corte*c.vel;c.start=b;c.dur=cb-b;c.p.fadeIn=Math.min(c.p.fadeIn,c.dur);}
  }
}
function dividirEm(clips,t){const novos=new Map();let n=0;
  for(const c of clips){if(travada(c.trilha))continue;if(t<=c.start+0.5/P.seq.fps||t>=fimDe(c)-0.5/P.seq.fps)continue;
    const r=clonar(c);r.id=uid();if(c.grupo){if(!novos.has(c.grupo))novos.set(c.grupo,uid());r.grupo=novos.get(c.grupo);}
    r.start=t;r.in=c.in+(t-c.start)*c.vel;r.dur=fimDe(c)-t;r.p.fadeIn=0;c.dur=t-c.start;c.p.fadeOut=0;P.clips.push(r);n++;}
  return n;}
function dividirNoIndicador(){const t=quadro(T);let alvo=[...sel].map(id=>P.clips.find(c=>c.id===id)).filter(c=>c&&ativoEm(c,t));
  if(!alvo.length)alvo=P.clips.filter(c=>ativoEm(c,t));
  if(!alvo.length)return toast('Não há clipe sob o indicador de reprodução.');
  marcar();const n=dividirEm(alvo,t);if(!n){desfazerPilha.pop();return;}posMudanca();}
function excluirSelecao(ondulada){if(!sel.size)return;
  mudar(()=>{const rem=P.clips.filter(c=>sel.has(c.id)&&!travada(c.trilha));
    for(const c of rem)P.clips.splice(P.clips.indexOf(c),1);
    if(ondulada){for(const c of rem.sort((a,b)=>b.start-a.start)){for(const o of P.clips)if(o.trilha===c.trilha&&o.start>=fimDe(c)-1e-6)o.start=Math.max(0,o.start-c.dur);}}
    sel.clear();});}
function inserirMidia(m,trilha,t){t=Math.max(0,quadro(t));const idx=Math.max(0,listaDe(trilha).indexOf(trilha));
  const vT=P.vT[Math.min(idx,P.vT.length-1)],aT=P.aT[Math.min(idx,P.aT.length-1)];const res=[];
  if(m.tipo==='video'){const g=m.temAudio?uid():null;res.push(novoClip('video',vT,t,m.dur,{midia:m.id,grupo:g}));
    if(m.temAudio)res.push(novoClip('audio',aT,t,m.dur,{midia:m.id,grupo:g}));}
  else if(m.tipo==='audio')res.push(novoClip('audio',ehV(trilha)?aT:trilha,t,m.dur,{midia:m.id}));
  else res.push(novoClip('imagem',ehV(trilha)?trilha:vT,t,5,{midia:m.id}));
  for(const r of res){if(travada(r.trilha)){toast('A trilha '+r.trilha+' está travada.');return[];}}
  for(const r of res){sobrescrever(r.trilha,r.start,fimDe(r),new Set());P.clips.push(r);}
  return res;}
function novoTexto(trilha,t){if(!trilha){trilha=[...P.vT].reverse().find(tr=>!travada(tr)&&!P.clips.some(c=>c.trilha===tr&&ativoEm(c,T)))||P.vT[P.vT.length-1];}
  t=Math.max(0,quadro(t??T));marcar();const c=novoClip('texto',trilha,t,5);sobrescrever(trilha,t,t+5,new Set());P.clips.push(c);
  sel=new Set([c.id]);foco=c.id;posMudanca();setTimeout(()=>{const a=$('#props textarea');if(a){a.focus();a.select();}},50);}
function copiar(recortar){if(!sel.size)return;const cl=P.clips.filter(c=>sel.has(c.id));const t0=Math.min(...cl.map(c=>c.start));
  areaTransf=cl.map(c=>Object.assign(clonar(c),{start:c.start-t0}));toast(recortar?'Recortado.':cl.length+' clipe(s) copiado(s).');if(recortar)excluirSelecao(false);}
function colar(){if(!areaTransf)return;mudar(()=>{const mapa=new Map();const novos=areaTransf.map(c=>{const n=clonar(c);n.id=uid();
    if(n.grupo){if(!mapa.has(n.grupo))mapa.set(n.grupo,uid());n.grupo=mapa.get(n.grupo);}n.start=quadro(T)+c.start;return n;});
  for(const n of novos){if(!P.trilhas[n.trilha])continue;sobrescrever(n.trilha,n.start,fimDe(n),new Set());P.clips.push(n);}
  sel=new Set(novos.map(n=>n.id));T=Math.max(...novos.map(fimDe));});}
function alternarVinculo(){const cl=P.clips.filter(c=>sel.has(c.id));if(!cl.length)return;
  if(cl.some(c=>c.grupo)){mudar(()=>cl.forEach(c=>c.grupo=null));toast('Clipes desvinculados — agora se movem separadamente.');}
  else if(cl.length>1){const g=uid();mudar(()=>cl.forEach(c=>c.grupo=g));toast('Clipes vinculados.');}}
function pontosEdicao(){const s=new Set([0]);for(const c of P.clips){s.add(+c.start.toFixed(5));s.add(+fimDe(c).toFixed(5));}return[...s].sort((a,b)=>a-b);}

/* ===================== mídia: importar ===================== */
const EXT_V=/\.(mp4|mov|m4v|webm|mkv|avi)$/i, EXT_A=/\.(mp3|wav|m4a|aac|ogg|oga|flac|opus|aif|aiff)$/i, EXT_I=/\.(png|jpe?g|webp|gif|bmp|heic|avif)$/i;
function tipoArquivo(f){if(/^image\//.test(f.type)||EXT_I.test(f.name))return'imagem';if(/^audio\//.test(f.type)||EXT_A.test(f.name))return'audio';if(/^video\//.test(f.type)||EXT_V.test(f.name))return'video';return null;}
function registrarArquivo(m,f){arquivos.set(m.id,f);if(urls.has(m.id))URL.revokeObjectURL(urls.get(m.id));const u=URL.createObjectURL(f);urls.set(m.id,u);
  if(m.tipo==='imagem'){const im=new Image();im.onload=()=>{imagens.set(m.id,im);sujo=true;};im.src=u;}sujo=true;}
async function escolherArquivos(){
  if(window.showOpenFilePicker){try{const hs=await showOpenFilePicker({multiple:true,types:[{description:'Vídeo, áudio e imagem',accept:{'video/*':['.mp4','.mov','.m4v','.webm','.mkv'],'audio/*':['.mp3','.wav','.m4a','.aac','.ogg','.flac'],'image/*':['.png','.jpg','.jpeg','.webp','.gif']}}]});
      const ent=[];for(const h of hs)ent.push({file:await h.getFile(),handle:h});return ent;}catch(e){if(e.name==='AbortError')return[];}}
  return new Promise(ok=>{const i=$('#arqIn');i.onchange=()=>{const fs=[...i.files];i.value='';ok(fs.map(f=>({file:f})));};i.click();});}
async function importar(entradas,depois){const novos=[];
  for(const{file,handle}of entradas){const tipo=tipoArquivo(file);if(!tipo){toast('“'+file.name+'” não é vídeo, áudio ou imagem.');continue;}
    $('#stTx').textContent='Importando '+file.name+'…';
    try{const m=await analisar(file,tipo);m.id=uid();P.midias.push(m);registrarArquivo(m,file);
      if(handle){handles.set(m.id,handle);try{await DB.put('arquivos',{id:m.id,handle});}catch(e){}}
      novos.push(m);renderBin();}
    catch(e){console.error(e);toast('Não consegui abrir “'+file.name+'”: '+(e.message||e),5000);}}
  $('#stTx').textContent=dicaFerramenta();salvarDepois();
  if(novos.length){toast(novos.length+' arquivo(s) importado(s). Arraste para a linha do tempo.');if(depois)depois(novos);filaPicos(novos);}
  return novos;}
async function miniatura(fonte,w,h){const W=160,H=90,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,W,H);
  const s=Math.min(W/w,H/h);g.drawImage(fonte,(W-w*s)/2,(H-h*s)/2,w*s,h*s);return c.toDataURL('image/jpeg',0.7);}
async function analisar(file,tipo){
  const m={nome:file.name,tipo,tamanho:file.size,dur:5,w:0,h:0,fps:0,temAudio:false,thumb:null,picos:null,ult:file.lastModified};
  if(tipo==='imagem'){const u=URL.createObjectURL(file);const im=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('formato de imagem não suportado'));i.src=u;});
    m.w=im.naturalWidth;m.h=im.naturalHeight;m.thumb=await miniatura(im,m.w,m.h);URL.revokeObjectURL(u);return m;}
  try{const B=await mb();const inp=new B.Input({source:new B.BlobSource(file),formats:B.ALL_FORMATS});
    m.dur=await inp.computeDuration();const vt=tipo==='audio'?null:await inp.getPrimaryVideoTrack();const at=await inp.getPrimaryAudioTrack();
    m.temAudio=!!at;
    if(vt){m.tipo='video';m.w=vt.displayWidth;m.h=vt.displayHeight;try{const st=await vt.computePacketStats(90);m.fps=Math.round(st.averagePacketRate*100)/100;}catch(e){}
      try{if(await vt.canDecode()){const sk=new B.CanvasSink(vt,{width:160,height:Math.max(2,Math.round(160*m.h/m.w)),fit:'contain'});const w=await sk.getCanvas(Math.min(1,m.dur/3));if(w)m.thumb=await miniatura(w.canvas,w.canvas.width,w.canvas.height);}else m.semDecod=true;}catch(e){}}
    else m.tipo='audio';
    if(m.tipo==='audio'&&!at)throw new Error('o arquivo não tem áudio');}
  catch(e){ // plano B: o próprio navegador
    const u=URL.createObjectURL(file);const v=document.createElement(tipo==='audio'?'audio':'video');v.preload='metadata';v.muted=true;v.src=u;
    await new Promise((ok,er)=>{v.onloadedmetadata=ok;v.onerror=()=>er(new Error('formato não suportado por este navegador'));});
    m.dur=v.duration;if(tipo!=='audio'&&v.videoWidth){m.tipo='video';m.w=v.videoWidth;m.h=v.videoHeight;m.temAudio=true;
      await new Promise(ok=>{v.onseeked=ok;v.currentTime=Math.min(1,m.dur/3);setTimeout(ok,1500);});try{m.thumb=await miniatura(v,m.w,m.h);}catch(e){}}
    else{m.tipo='audio';m.temAudio=true;}URL.revokeObjectURL(u);}
  return m;}
/* forma de onda (picos), calculada aos poucos em segundo plano */
const PR=20;let picosOcupado=false;const filaP=[];
function filaPicos(ms){for(const m of ms)if(m.temAudio&&!m.picos&&arquivos.has(m.id))filaP.push(m);if(!picosOcupado)proxPicos();}
async function proxPicos(){const m=filaP.shift();if(!m){picosOcupado=false;return;}picosOcupado=true;
  try{const B=await mb();const inp=new B.Input({source:new B.BlobSource(arquivos.get(m.id)),formats:B.ALL_FORMATS});const at=await inp.getPrimaryAudioTrack();
    const n=Math.ceil(m.dur*PR)+1,arr=new Uint8Array(n);const sk=new B.AudioBufferSink(at);let k=0;
    for await(const w of sk.buffers()){const b=w.buffer,sr=b.sampleRate,d=b.getChannelData(0);
      for(let i=0;i<b.length;i+=3){const v=Math.abs(d[i]);const ix=Math.floor((w.timestamp+i/sr)*PR);if(ix>=0&&ix<n){const q=Math.min(255,v*255|0);if(q>arr[ix])arr[ix]=q;}}
      if(++k%40===0)await tick();}
    let s='';for(let i=0;i<arr.length;i+=8192)s+=String.fromCharCode.apply(null,arr.subarray(i,i+8192));m.picos=btoa(s);}
  catch(e){console.warn('picos',e);}
  if(m.picos)m._p=null;renderTimeline();salvarDepois();setTimeout(proxPicos,50);}
function picosDe(m){if(!m.picos)return null;if(!m._p){const s=atob(m.picos);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);Object.defineProperty(m,'_p',{value:a,writable:true,enumerable:false});}return m._p;}

  b.innerHTML='';let off=0;

    d.querySelector('b').textContent=m.nome;d.title=m.nome+(on?'':'\nArquivo desconectado: use “Reconectar”.');b.appendChild(d);}

$('#bin').addEventListener('contextmenu',e=>{const it=e.target.closest('.mi');if(!it)return;e.preventDefault();const m=P.midias.find(x=>x.id===it.dataset.id);

  const m=P.midias.find(x=>x.id===a.id);const t=snapT(tempoEm(e.clientX),new Set());marcar();const r=inserirMidia(m,pista.dataset.tr,t);
  if(!r.length){desfazerPilha.pop();return;}sel=new Set(r.map(c=>c.id));foco=r[0].id;posMudanca();});
/* soltar arquivos do Finder */
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();});
document.addEventListener('drop',async e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();if(!P)return;
  const ent=[];const items=[...e.dataTransfer.items||[]];
  for(let i=0;i<e.dataTransfer.files.length;i++){const f=e.dataTransfer.files[i];let h=null;
    try{if(items[i]&&items[i].getAsFileSystemHandle){h=await items[i].getAsFileSystemHandle();if(h&&h.kind!=='file')h=null;}}catch(x){}ent.push({file:f,handle:h});}
  const pista=e.target.closest&&e.target.closest('.pista[data-tr]');const tr=pista?pista.dataset.tr:null;const t=tr?tempoEm(e.clientX):0;
  importar(ent,tr?(novos=>{marcar();let tt=t;const ids=[];for(const m of novos){const r=inserirMidia(m,tr,tt);ids.push(...r.map(c=>c.id));tt+=m.tipo==='imagem'?5:m.dur;}sel=new Set(ids);posMudanca();}):null);});
/* reconectar mídias */
$('#btReconectar').onclick=reconectar;
async function reconectar(){let ok=0;
  for(const m of P.midias){if(arquivos.has(m.id))continue;const h=handles.get(m.id);if(!h)continue;
    try{if((await h.requestPermission({mode:'read'}))==='granted'){registrarArquivo(m,await h.getFile());ok++;}}catch(e){}}
  const faltam=P.midias.filter(m=>!arquivos.has(m.id));
  if(faltam.length){toast('Escolha os arquivos que faltam: '+faltam.map(m=>m.nome).slice(0,4).join(', ')+(faltam.length>4?'…':''),6000);
    const ent=await escolherArquivos();
    for(const{file,handle}of ent){const m=faltam.find(x=>!arquivos.has(x.id)&&x.nome===file.name&&(!x.tamanho||x.tamanho===file.size))||faltam.find(x=>!arquivos.has(x.id)&&x.nome===file.name);
      if(m){registrarArquivo(m,file);ok++;if(handle){handles.set(m.id,handle);DB.put('arquivos',{id:m.id,handle}).catch(()=>{});}}}}
  if(ok)toast(ok+' mídia(s) reconectada(s).');renderBin();renderTimeline();limparElems();sujo=true;filaPicos(P.midias);}

/* ===================== linha do tempo ===================== */
const tl=$('#tl');
function larguraTl(){return Math.max(durSeq()+30,(tl.clientWidth-CAB)/pps)*pps;}

function elemClip(c){const d=document.createElement('div');const m=midiaDe(c);const off=m&&!arquivos.has(m.id);

  if(c.tipo==='audio'&&m){const pk=picosDe(m);if(pk){const cv=document.createElement('canvas');cv.className='onda';const cw=Math.min(4000,Math.ceil(w));cv.width=cw;cv.height=36;
      const g=cv.getContext('2d');g.fillStyle='rgba(190,255,190,.8)';const s0=c.in,span=c.dur*c.vel;
      for(let x=0;x<cw;x++){const a=Math.floor((s0+span*x/cw)*PR),b=Math.max(a+1,Math.floor((s0+span*(x+1)/cw)*PR));let mx=0;for(let i=a;i<b&&i<pk.length;i++)if(pk[i]>mx)mx=pk[i];
        const hh=Math.max(1,mx/255*34*dbLin(c.p.nivel));g.fillRect(x,18-hh/2,1,hh);}d.prepend(cv);}}

  if(c.p.fadeOut>0){const f=document.createElement('div');f.className='fx d';f.style.width=c.p.fadeOut*pps+'px';d.appendChild(f);}

function desenharRegua(){const cv=$('#regua');if(!cv)return;const dpr=devicePixelRatio||1,W=Math.max(10,tl.clientWidth-CAB);
  cv.width=W*dpr;cv.height=26*dpr;cv.style.width=W+'px';const g=cv.getContext('2d');g.scale(dpr,dpr);

  const t0=tl.scrollLeft/pps,t1=t0+W/pps;const fps=P.seq.fps;
  const passos=[1/fps,2/fps,5/fps,10/fps,.5,1,2,5,10,15,30,60,120,300,600,900,1800,3600];const passo=passos.find(p=>p*pps>=80)||3600;
  g.strokeStyle=cs.getPropertyValue('--tx2');g.fillStyle=cs.getPropertyValue('--tx2');g.font='10px -apple-system,sans-serif';g.textBaseline='top';
  const sub=passo/5;g.beginPath();
  for(let t=Math.floor(t0/sub)*sub;t<=t1;t+=sub){const x=Math.round((t-t0)*pps)+.5;const maior=Math.abs(t/passo-Math.round(t/passo))<1e-6;g.moveTo(x,maior?12:19);g.lineTo(x,26);if(maior)g.fillText(tc(t),x+3,2);}
  g.stroke();}

function alvosSnap(ign){const a=[0,T];for(const c of P.clips){if(ign.has(c.id))continue;a.push(c.start,fimDe(c));}return a;}
function snapT(t,ign,mostrar=true){if(!snap){esconderSnap();return quadro(t);}const tol=8/pps;let best=null,bd=tol;
  for(const a of alvosSnap(ign)){const d=Math.abs(a-t);if(d<bd){bd=d;best=a;}}
  if(best!==null){if(mostrar)mostrarSnap(best);return best;}esconderSnap();return quadro(t);}
function mostrarSnap(t){const s=$('#snapLin');if(s){s.style.left=(CAB+t*pps)+'px';s.style.display='block';}}

let arr=null;
tl.addEventListener('pointerdown',e=>{if(e.button!==0||!P)return;if(e.target.closest('.cab'))return;fecharMenu();
  const regua=e.target.closest('.regua');
  if(regua){arr={modo:'regua'};tl.setPointerCapture(e.pointerId);irPara(snapT(tempoEm(e.clientX),new Set()));return;}
  const ce=e.target.closest('.clip');const pista=e.target.closest('.pista[data-tr]');
  if(ferramenta==='txt'&&pista&&ehV(pista.dataset.tr)){novoTexto(pista.dataset.tr,snapT(tempoEm(e.clientX),new Set(),false));definirFerramenta('sel');return;}
  if(!ce){if(!e.shiftKey){sel.clear();foco=null;renderTimeline();renderProps();}
    arr={modo:'regua'};tl.setPointerCapture(e.pointerId);irPara(snapT(tempoEm(e.clientX),new Set()));return;}
  const c=P.clips.find(x=>x.id===ce.dataset.id);if(!c)return;
  if(travada(c.trilha)){toast('Trilha '+c.trilha+' travada.');return;}
  if(ferramenta==='nav'){let t=tempoEm(e.clientX);if(snap&&Math.abs(t-T)*pps<8)t=T;t=quadro(t);marcar();if(!dividirEm(grupoDe(c),t)){desfazerPilha.pop();return;}posMudanca();return;}
  const g=grupoDe(c);
  if(e.shiftKey){const tem=sel.has(c.id);g.forEach(x=>tem?sel.delete(x.id):sel.add(x.id));}
  else if(!sel.has(c.id))sel=new Set(g.map(x=>x.id));
  foco=c.id;renderTimeline();renderProps();
  tl.setPointerCapture(e.pointerId);
  const borda=e.target.closest('.borda');
  if(borda){const lado=borda.classList.contains('e')?'e':'d';const alvo=grupoDe(c);
    arr={modo:'apara',lado,x0:e.clientX,base:instantaneo(),movido:false,orig:alvo.map(x=>({id:x.id,start:x.start,dur:x.dur,in:x.in})),cid:c.id};return;}
  const mov=P.clips.filter(x=>sel.has(x.id)&&!travada(x.trilha));
  arr={modo:'move',x0:e.clientX,cid:c.id,trOrig:c.trilha,base:instantaneo(),movido:false,orig:mov.map(x=>({id:x.id,start:x.start,trilha:x.trilha}))};});
tl.addEventListener('pointermove',e=>{if(!arr)return;
  if(arr.modo==='regua'){irPara(snapT(tempoEm(e.clientX),new Set()));autoRolar(e);return;}
  const dx=(e.clientX-arr.x0)/pps;if(!arr.movido&&Math.abs(e.clientX-arr.x0)<3)return;

  const ids=new Set(arr.orig.map(o=>o.id));
  if(arr.modo==='move'){const oc=arr.orig.find(o=>o.id===arr.cid);const c=P.clips.find(x=>x.id===arr.cid);
    let dt=dx;const minStart=Math.min(...arr.orig.map(o=>o.start));if(minStart+dt<0)dt=-minStart;
    if(snap){const s=oc.start+dt,f=s+c.dur;const ss=snapT(s,ids,false),sf=snapT(f,ids,false);const ds=ss-s,df=sf-f;
      const usar=(Math.abs(ds)<=Math.abs(df)&&Math.abs(ds)<8/pps)?ds:(Math.abs(df)<8/pps?df:null);
      if(usar!==null){dt+=usar;mostrarSnap(usar===ds?ss:sf);}else{dt=quadro(oc.start+dt)-oc.start;esconderSnap();}}

      if(ok&&ehV(o.trilha)===ehV(arr.trOrig)){const L=listaDe(o.trilha);x.trilha=L[L.indexOf(o.trilha)+dTr];}else x.trilha=o.trilha;}

  }

function soltarTl(e){if(!arr)return;const a=arr;arr=null;esconderSnap();

const temFiltroCanvas=(()=>{try{const g=document.createElement('canvas').getContext('2d');g.filter='brightness(0.5)';return g.filter==='brightness(0.5)';}catch(e){return false;}})();

  if(temFiltroCanvas){cctx.filter=`brightness(${br}) contrast(${ct}) saturate(${sa})`;cctx.drawImage(fonte,sx,sy,sw,sh,0,0,w,h);cctx.filter='none';}
  else{cctx.drawImage(fonte,sx,sy,sw,sh,0,0,w,h);if(br!==1||ct!==1||sa!==1){const d=cctx.getImageData(0,0,w,h),a=d.data;

  if(p.temperatura)tint(p.temperatura>0?'#ff8a00':'#0077ff',Math.abs(p.temperatura)/100*0.7);
  if(p.matiz)tint(p.matiz>0?'#ff00c8':'#00ff40',Math.abs(p.matiz)/100*0.5);

function desenharMidia(ctx,c,img,w0,h0,t,k){const p=c.p,a=p.opac/100*envelope(c,t);if(a<=0.002||!w0||!h0)return;

    for(const w of this.fila){const b=w.buffer,off=Math.round((w.timestamp-s0)*sr),i0=Math.max(0,-off),i1=Math.min(b.length,n-off);if(i1<=i0)continue;
      for(let ch=0;ch<nc;ch++)canais[ch].set(b.getChannelData(Math.min(ch,b.numberOfChannels-1)).subarray(i0,i1),off+i0);}
    this.fila=this.fila.filter(w=>w.timestamp+w.duration>s1-0.001);return{canais,n,sr};}}
$('#abaExp').onclick=()=>dlgExportar();
window.addEventListener('beforeunload',e=>{if(exportando){e.preventDefault();e.returnValue='';}});

/* ===================== teclado ===================== */
document.addEventListener('keydown',e=>{if(!P||dlgAberto)return;const a=document.activeElement;if(a&&(/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&a.type!=='range')return;
  const cmd=e.metaKey||e.ctrlKey,k=e.key.toLowerCase(),fps=P.seq.fps;let ok=true;
  if(e.key===' '){tocarPausar();}
  else if(cmd&&k==='z'){e.shiftKey?refazer():desfazer();}else if(cmd&&k==='y'){refazer();}
  else if(cmd&&k==='k'){dividirNoIndicador();}else if(cmd&&k==='c'){copiar(false);}else if(cmd&&k==='x'){copiar(true);}else if(cmd&&k==='v'){colar();}
  else if(cmd&&k==='a'){if(e.shiftKey){sel.clear();renderTimeline();renderProps();}else selTudo();}
  else if(cmd&&k==='l'){alternarVinculo();}else if(cmd&&k==='s'){salvarAgora();toast('Projeto salvo.');}
  else if(cmd&&k==='i'){$('#btImportar').click();}else if(cmd&&k==='m'){dlgExportar();}
  else if(cmd){ok=false;}
  else if(e.key==='Delete'||e.key==='Backspace'){excluirSelecao(e.shiftKey);}
  else if(e.key==='ArrowLeft'){pararReproducao();irPara(quadro(T)-(e.shiftKey?1:1/fps));}
  else if(e.key==='ArrowRight'){pararReproducao();irPara(quadro(T)+(e.shiftKey?1:1/fps));}
  else if(e.key==='ArrowUp'){const p=pontosEdicao().filter(x=>x<T-1e-4);irPara(p.length?p[p.length-1]:0);}
  else if(e.key==='ArrowDown'){const p=pontosEdicao().find(x=>x>T+1e-4);if(p!=null)irPara(p);}
  else if(e.key==='Home'){irPara(0);}else if(e.key==='End'){irPara(durSeq());}
  else if(k==='v'){definirFerramenta('sel');}else if(k==='c'){definirFerramenta('nav');}else if(k==='t'){definirFerramenta('txt');}
  else if(k==='s'){$('#gSnap').click();}else if(k==='k'){pararReproducao();}else if(k==='l'){if(!tocando)tocar();}else if(k==='j'){irPara(T-5);}
  else if(e.key==='+'||e.key==='='){definirZoom(pps*1.5);}else if(e.key==='-'){definirZoom(pps/1.5);}else if(e.key==='\\'){zoomTudo();}
  else if(e.key==='Escape'){sel.clear();renderTimeline();renderProps();definirFerramenta('sel');}
  else ok=false;
  if(ok)e.preventDefault();});

/* ===================== início ===================== */
(async function iniciar(){
  try{if(localStorage.getItem('opsis-tema')==='claro')aplicarTema(true);const h=localStorage.getItem('opsis-hsup');if(h)document.documentElement.style.setProperty('--hSup',h);}catch(e){}
  definirFerramenta('sel');requestAnimationFrame(laco);
  let p=null;try{const u=await DB.get('config','ultimo');if(u)p=await DB.get('projetos',u.v);if(!p){const ps=await DB.todos('projetos');p=ps.sort((a,b)=>b.atualizado-a.atualizado)[0];}}catch(e){console.error(e);}
  if(p)abrirProjeto(p);else dlgNovoProjeto(false);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();
